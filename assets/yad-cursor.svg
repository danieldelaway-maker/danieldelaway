<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 40 40">
  <!-- Yad (Torah pointer), drawn pointing straight up, then turned to point up-left.
       Fingertip sits at (2.5,2.5) in this box, i.e. (3,3) at 48px: the cursor's click point. -->
  <defs>
    <linearGradient id="s" x1="0" x2="1">
      <stop offset="0" stop-color="#fbf8f1"/><stop offset=".5" stop-color="#d3cdc1"/><stop offset="1" stop-color="#948d80"/>
    </linearGradient>
  </defs>
  <g transform="translate(2.5 2.5) rotate(-45) translate(0 0.6)" stroke="#2a1d10" stroke-width="1.15" stroke-linejoin="round" fill="url(#s)">
    <!-- shaft with a turned ring and end knob -->
    <rect x="-1.7" y="18" width="3.4" height="14" rx="1.5"/>
    <rect x="-3" y="23.5" width="6" height="2.6" rx="1.3"/>
    <circle cx="0" cy="33.6" r="2.8"/>
    <!-- cuff -->
    <rect x="-4" y="16" width="8" height="3" rx="1.3"/>
    <!-- closed fist -->
    <path d="M-4.8 16.4 C-5.6 12 -5 8.4 -2 7.6 L2 7.6 C5 8.4 5.6 12 4.8 16.4 Z"/>
    <path d="M-4.6 11.6 C-2.6 12.6 2.6 12.6 4.6 11.6" fill="none" stroke-width=".85"/>
    <!-- long pointing index finger -->
    <path d="M-1.6 8.4 L-1.6 1.2 C-1.6 -0.7 1.6 -0.7 1.6 1.2 L1.6 8.4"/>
    <path d="M-1.6 4.6 L1.6 4.6" fill="none" stroke-width=".7"/>
  </g>
</svg>
