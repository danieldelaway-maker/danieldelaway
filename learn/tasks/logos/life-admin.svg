<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 20 290 112" role="img" aria-label="Life Admin">
  <!-- soft paper-coloured wash behind the still life -->
  <path d="M44 114 C 30 76, 74 40, 132 42 C 176 44, 214 26, 262 40 C 304 52, 300 104, 262 116 C 214 130, 92 136, 44 114 Z" fill="#f6e4d7"/>
  <g fill="#e8b897"><circle cx="276" cy="30" r="2.2"/><circle cx="286" cy="40" r="1.4"/><circle cx="34" cy="62" r="1.8"/></g>

  <g stroke="#1d2230" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- table -->
    <path d="M20 118 H 300" fill="none"/>

    <!-- plant: leaves first, then pot over the stems -->
    <g fill="none">
      <path d="M66 98 C 66 80, 62 66, 54 52"/>
      <path d="M68 98 C 70 84, 76 74, 86 66"/>
      <path d="M67 98 C 62 88, 52 84, 42 84"/>
    </g>
    <g fill="#fffaf6">
      <path d="M54 52 C 42 50, 36 38, 40 26 C 52 30, 58 42, 54 52 Z"/>
      <path d="M86 66 C 86 54, 96 46, 106 46 C 106 58, 98 66, 86 66 Z"/>
      <path d="M42 84 C 34 78, 26 80, 22 86 C 30 92, 38 90, 42 84 Z"/>
    </g>
    <g fill="none" stroke-width="1"><path d="M40 27 L 54 51"/><path d="M106 46 L 87 65"/><path d="M23 86 L 41 84"/></g>
    <path d="M50 98 H 84 L 80 118 H 54 Z" fill="#fffaf6"/>
    <path d="M52 106 H 82" fill="none" stroke-width="1"/>

    <!-- tear-off calendar: 25 -->
    <rect x="106" y="74" width="38" height="44" rx="4" fill="#fffaf6"/>
    <path d="M106 86 V 78 A 4 4 0 0 1 110 74 H 140 A 4 4 0 0 1 144 78 V 86 Z" fill="#d9622b" stroke="#1d2230"/>
    <g fill="#fffaf6"><circle cx="116" cy="74" r="2.2"/><circle cx="134" cy="74" r="2.2"/></g>

    <!-- envelope peeking out behind the papers -->
    <g transform="rotate(8 230 90)">
      <rect x="200" y="74" width="54" height="36" rx="2" fill="#fffaf6"/>
      <path d="M200 76 L 227 96 L 254 76" fill="none"/>
    </g>

    <!-- stack of papers with a paperclip -->
    <rect x="152" y="70" width="62" height="48" rx="2" fill="#fffaf6" transform="rotate(-5 183 94)"/>
    <rect x="154" y="66" width="62" height="52" rx="2" fill="#fffaf6" transform="rotate(3 185 92)"/>
    <rect x="156" y="64" width="60" height="54" rx="2" fill="#fffaf6"/>
    <g fill="none" stroke-width="1.1">
      <path d="M166 78 H 200"/><path d="M166 86 H 206"/><path d="M166 94 H 194"/>
    </g>
    <rect x="166" y="101" width="9" height="9" rx="1.5" fill="none" stroke-width="1.1"/>
    <path d="M180 106 H 204" fill="none" stroke-width="1.1"/>
    <path d="M202 58 V 74 A 4 4 0 0 0 210 74 V 61 A 2.5 2.5 0 0 0 205 61 V 72" fill="none" stroke-width="1.2"/>

    <!-- pen lying in front -->
    <g transform="rotate(-11 150 124)">
      <rect x="120" y="121" width="56" height="6" rx="3" fill="#fffaf6"/>
      <path d="M176 121.6 L 186 124 L 176 126.4" fill="#fffaf6"/>
      <path d="M130 121 V 127" fill="none" stroke-width="1.1"/>
    </g>

    <!-- mug with steam -->
    <path d="M268 94 C 282 94, 282 112, 268 112" fill="none"/>
    <path d="M244 88 H 270 V 112 A 6 6 0 0 1 264 118 H 250 A 6 6 0 0 1 244 112 Z" fill="#fffaf6"/>
    <path d="M244 98 H 270" fill="none" stroke-width="1"/>
    <g fill="none" stroke-width="1.2"><path d="M252 80 C 248 74, 256 70, 252 62"/><path d="M262 80 C 258 72, 266 68, 262 58"/></g>
  </g>

  <!-- small hand-set details -->
  <text x="125" y="111" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1d2230">25</text>
  <path d="M168 105.5 L 170.5 108 L 174 103" fill="none" stroke="#d9622b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M249 104 C 251 101, 254 101, 255.5 104 C 257 101, 260 101, 261 104 C 261 107, 255.5 110, 255.5 110 C 255.5 110, 249 107, 249 104 Z" fill="#d9622b"/>
</svg>
