<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Tasks</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css?v=13">
  <style>
    :root {
      --late: #ff8a8a; --line: rgba(255,255,255,.1);
      /* white task area */
      --w-bg: #ffffff; --w-card: #f6f7fa; --w-line: #e3e6ee; --w-ink: #12141c; --w-text: #3d4352; --w-muted: #6b7183;
      --w-late: #c62f2f; --w-soon: #a86400; --w-accent: #0f8f86;
    }
    .top { margin-bottom: 40px; }
    h1 { font-size: clamp(32px, 5vw, 52px); margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 32px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; min-width: 0; }
    section { margin-bottom: 28px; }

    /* lock screen (same as Clients HQ) */
    #lock { max-width: 420px; margin: 8vh auto 0; text-align: center; }
    #lock form { display: flex; gap: 10px; margin-top: 18px; }
    #lock input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); font: inherit; }
    button { cursor: pointer; padding: 10px 16px; border-radius: 12px; border: 0; font: 600 14px var(--font); color: #0b0d14; background: linear-gradient(135deg, var(--blue), var(--teal)); }
    .err { color: var(--late); font-size: 14px; min-height: 20px; margin-top: 10px; }

    /* totals */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .kpi .v { font-family: var(--display); font-size: 34px; font-weight: 700; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi .l { font-size: 13px; color: var(--muted); }
    .kpi.hot .v { color: var(--late); }

    /* white brand boards */
    .board { background: var(--w-bg); border-radius: 18px; padding: 20px; min-width: 0; color: var(--w-text); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .board h2 { font-family: var(--display); color: var(--w-ink); font-size: 20px; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .brands { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
    .bhead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .count { font: 700 13px var(--font); font-variant-numeric: tabular-nums; padding: 2px 10px; border-radius: 999px; background: #eef0f5; color: var(--w-muted); }
    .count.has { color: #fff; background: var(--w-accent); }
    #due h2 { margin-bottom: 14px; }

    .tasks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .tcard { background: var(--w-card); border: 1px solid var(--w-line); border-radius: 12px; padding: 12px 12px 12px 10px; display: flex; gap: 10px; align-items: flex-start; }
    .tcard.done { opacity: .6; }
    .tcard.saving { opacity: .55; }
    .tick { flex: none; appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 1px 0 0; border: 2px solid #b9bfcc; border-radius: 6px; background: #fff; cursor: pointer; display: grid; place-content: center; transition: background .15s, border-color .15s; }
    .tick:hover { border-color: var(--w-accent); }
    .tick:checked { background: var(--w-accent); border-color: var(--w-accent); }
    .tick:checked::after { content: ''; width: 5px; height: 10px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
    .tick:focus-visible { outline: 2px solid var(--w-accent); outline-offset: 2px; }
    .tbody { flex: 1; min-width: 0; cursor: pointer; }
    .trow { display: flex; align-items: flex-start; gap: 8px; }
    .trow b { flex: 1; min-width: 0; color: var(--w-ink); font-weight: 600; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
    .tcard.done .trow b { text-decoration: line-through; font-weight: 500; color: var(--w-muted); }
    .tbody small { display: block; color: var(--w-text); font-size: 13.5px; line-height: 1.5; margin-top: 4px; }
    .src { color: var(--w-muted); font-size: 12px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .src a { color: var(--w-accent); font-weight: 600; text-decoration: none; }
    .src a:hover { text-decoration: underline; }
    .chip { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; color: var(--w-muted); white-space: nowrap; }
    .chip.late { color: var(--w-late); } .chip.soon { color: var(--w-soon); } .chip.brand { color: var(--w-accent); }
    .edit { flex: none; background: none; border: 0; padding: 2px 4px; color: var(--w-muted); font: 500 12px var(--font); border-radius: 6px; }
    .edit:hover { color: var(--w-ink); background: #e9ecf2; }
    .empty { color: var(--w-muted); font-size: 14px; margin: 0; }

    /* edit form */
    .form { flex: 1; min-width: 0; display: grid; gap: 8px; }
    .form label { font-size: 12px; font-weight: 600; color: var(--w-muted); display: grid; gap: 4px; }
    .form input, .form textarea { width: 100%; min-width: 0; box-sizing: border-box; font: 400 14px/1.45 var(--font); color: var(--w-ink); background: #fff; border: 1px solid #cfd4df; border-radius: 8px; padding: 8px 10px; }
    .form input:focus, .form textarea:focus { outline: 2px solid var(--w-accent); outline-offset: -1px; border-color: transparent; }
    .form textarea { min-height: 70px; resize: vertical; }
    .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 420px) { .form .two { grid-template-columns: 1fr; } }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btns button { padding: 8px 14px; font-size: 13px; }
    .btns .ghost { background: #e9ecf2; color: var(--w-ink); }
    .btns .del { margin-left: auto; background: none; color: var(--w-late); padding: 8px 4px; }
    .add { margin-top: 10px; width: 100%; background: none; border: 1.5px dashed #cfd4df; color: var(--w-muted); font-weight: 600; }
    .add:hover { border-color: var(--w-accent); color: var(--w-accent); }

    details { margin-top: 12px; border-top: 1px solid var(--w-line); padding-top: 10px; }
    summary { cursor: pointer; font-size: 13px; color: var(--w-muted); }
    summary:hover { color: var(--w-ink); }
    details .tasks { margin-top: 10px; }

    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #12141c; color: #fff; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); z-index: 10; }
    .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 40px; font-size: 13px; color: var(--muted); }
    .foot a { color: var(--muted); }
    .foot button { background: none; color: var(--muted); padding: 0; font-weight: 500; text-decoration: underline; }
    .how { color: var(--muted); font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="grain"></span></div>
  <main class="wrap">
    <header class="top"><a class="mono" href="/learn/" aria-label="Back to the learning list">DD</a></header>

    <div id="lock">
      <p class="eyebrow">Private</p>
      <h1>Brand Tasks</h1>
      <form id="unlock"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button>Open</button></form>
      <p class="sub" id="loading" hidden>Loading from Notion…</p>
      <div class="err" id="err"></div>
    </div>

    <div id="app" hidden>
      <p class="eyebrow">Private · Every brand</p>
      <h1>The little <span class="grad">things.</span></h1>
      <p class="sub" id="built"></p>

      <section class="kpis" id="kpis"></section>
      <section class="board" id="due" hidden><div class="bhead"><h2>Due now</h2></div><ul class="tasks" id="dueList"></ul></section>
      <section class="brands" id="brands"></section>
      <p class="how">Ticks and edits save straight to Notion (Work page → Brand Tasks), and changes made in Notion show up here. Claude also adds tasks when it reviews each brand.</p>
      <div class="foot"><a href="/learn/">← Back to the learning list</a><button id="lockBtn">Lock</button></div>
    </div>
  </main>
  <div id="toast" hidden role="status"></div>

<script>
const API = 'https://brand-tasks-api.danieldelaway.workers.dev';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const KEY = 'clientsHQ'; // same password as Clients HQ, so one unlock covers both
let pass = '', data = null, editing = null, editIn = ''; // editing = task id, or 'new:<brandId>'; editIn = 'due' or 'brand'

async function api(path, method = 'GET', body) {
  const r = await fetch(API + path, { method, headers: { 'X-Key': pass, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || 'Something went wrong'), { status: r.status });
  return d;
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4000); }

async function load(quiet) {
  try { data = await api('/tasks'); if (!editing) render(); return true; }
  catch (e) { if (e.status === 401) throw e; if (!quiet) toast('Could not reach Notion: ' + e.message); return false; }
}
async function open(p, remember) {
  pass = p;
  try {
    await load();
    if (remember) store.set(KEY, p);
    $('#lock').hidden = true; $('#app').hidden = false;
  } catch (e) { if (remember) $('#err').textContent = 'That password didn’t work.'; }
}
$('#unlock').addEventListener('submit', e => { e.preventDefault(); $('#err').textContent = ''; $('#loading').hidden = false; open($('#pw').value.trim(), true).then(() => $('#loading').hidden = true); });
$('#lockBtn').addEventListener('click', () => { store.del(KEY); location.reload(); });
const saved = store.get(KEY);
if (saved) { $('#unlock').hidden = true; $('#err').textContent = ''; $('#loading').hidden = false; open(saved, false).then(() => { $('#unlock').hidden = false; $('#loading').hidden = true; }); }
// Pick up changes made in Notion.
setInterval(() => { if (data && !editing && !document.hidden) load(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (data && !editing && !document.hidden) load(true); });

const day = s => new Date(s + 'T00:00');
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const diff = s => Math.round((day(s) - today()) / 864e5);
const short = s => day(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
function dueChip(t) {
  if (!t.due || t.done) return '';
  const n = diff(t.due);
  const label = n < 0 ? `${-n}d late` : n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : short(t.due);
  return `<span class="chip ${n < 0 ? 'late' : n <= 2 ? 'soon' : ''}">${label}</span>`;
}
const linkLabel = u => { try { const h = new URL(u).hostname.replace(/^www\./, ''); return h === 'claude.ai' ? 'Open plan' : 'Open ' + h; } catch { return 'Open link'; } };

function form(t, brandId) {
  const isNew = !t;
  t = t || { text: '', detail: '', due: '', link: '' };
  return `<form class="form" data-id="${isNew ? '' : t.id}" data-brand="${brandId || ''}">
    <label>Task<input name="text" value="${esc(t.text)}" placeholder="What needs doing?" required maxlength="1800"></label>
    <label>Details<textarea name="detail" placeholder="Any context (optional)" maxlength="1800">${esc(t.detail)}</textarea></label>
    <div class="two"><label>Due date<input type="date" name="due" value="${esc(t.due)}"></label>
    <label>Link<input type="url" name="link" value="${esc(t.link)}" placeholder="https://… (optional)"></label></div>
    <div class="btns"><button type="submit">${isNew ? 'Add task' : 'Save'}</button><button type="button" class="ghost" data-act="cancel">Cancel</button>
    ${isNew ? '' : '<button type="button" class="del" data-act="delete">Delete</button>'}</div></form>`;
}
function card(t, brandName) {
  if (editing === t.id && editIn === (brandName ? 'due' : 'brand')) return `<li class="tcard">${form(t)}</li>`;
  const safe = /^https?:\/\//.test(t.link || '') ? t.link : '';
  const meta = [t.source && `<span>${esc(t.source)}</span>`, safe && `<a href="${esc(safe)}" target="_blank" rel="noopener">${esc(linkLabel(safe))} ↗</a>`].filter(Boolean).join('');
  return `<li class="tcard ${t.done ? 'done' : ''}" data-id="${t.id}">
    <input type="checkbox" class="tick" ${t.done ? 'checked' : ''} aria-label="Mark “${esc(t.text)}” done">
    <div class="tbody" data-act="edit"><div class="trow"><b>${esc(t.text)}</b>${brandName ? `<span class="chip brand">${esc(brandName)}</span>` : ''}${dueChip(t)}</div>
    ${t.detail && !t.done ? `<small>${esc(t.detail)}</small>` : ''}${meta ? `<div class="src">${meta}</div>` : ''}</div>
    <button class="edit" data-act="edit" aria-label="Edit task">Edit</button></li>`;
}
const order = (a, b) => (a.due || '9999').localeCompare(b.due || '9999');

function render() {
  const d = data;
  $('#built').textContent = 'Synced with Notion ' + new Date(d.synced).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  const open = d.tasks.filter(t => !t.done);
  const late = open.filter(t => t.due && diff(t.due) < 0);
  const soon = open.filter(t => t.due && diff(t.due) >= 0 && diff(t.due) <= 2);
  const week = open.filter(t => t.due && diff(t.due) > 2 && diff(t.due) <= 7);
  $('#kpis').innerHTML = [[open.length, 'Open tasks', ''], [late.length, 'Late', late.length ? 'hot' : ''], [soon.length, 'Due in 2 days', ''], [week.length, 'Later this week', '']]
    .map(([v, l, c]) => `<div class="panel kpi ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  const name = Object.fromEntries(d.brands.map(x => [x.id, x.name]));
  const now = late.concat(soon).sort(order);
  $('#due').hidden = !now.length;
  $('#dueList').innerHTML = now.map(t => card(t, name[t.brand])).join('');

  $('#brands').innerHTML = d.brands.map(br => {
    const mine = d.tasks.filter(t => t.brand === br.id);
    const o = mine.filter(t => !t.done).sort(order);
    const done = mine.filter(t => t.done);
    const adding = editing === 'new:' + br.id;
    return `<article class="board"><div class="bhead"><h2>${esc(br.name)}</h2><span class="count ${o.length ? 'has' : ''}" title="${o.length} open">${o.length}</span></div>
      ${o.length || adding ? `<ul class="tasks">${o.map(t => card(t)).join('')}${adding ? `<li class="tcard">${form(null, br.id)}</li>` : ''}</ul>` : '<p class="empty">Nothing open.</p>'}
      ${adding ? '' : `<button class="add" data-act="add" data-brand="${br.id}">+ Add task</button>`}
      ${done.length ? `<details><summary>Done (${done.length})</summary><ul class="tasks">${done.map(t => card(t)).join('')}</ul></details>` : ''}</article>`;
  }).join('');
  const f = document.querySelector('.form input[name=text]'); if (f && !f.value) f.focus();
}

const find = id => data.tasks.find(t => t.id === id);
document.addEventListener('change', async e => {
  if (!e.target.classList.contains('tick')) return;
  const li = e.target.closest('.tcard'), t = find(li.dataset.id), done = e.target.checked;
  t.done = done; render();
  try { await api('/tasks/' + t.id, 'PATCH', { done }); toast(done ? 'Ticked off. Saved to Notion.' : 'Moved back to open.'); }
  catch (err) { t.done = !done; render(); toast('Not saved: ' + err.message); }
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || e.target.closest('a')) return;
  const act = el.dataset.act;
  if (act === 'edit') { if (editing) return; editing = el.closest('.tcard').dataset.id; editIn = el.closest('#dueList') ? 'due' : 'brand'; render(); document.querySelector('.form input[name=text]')?.focus(); }
  else if (act === 'add') { editing = 'new:' + el.dataset.brand; render(); }
  else if (act === 'cancel') { editing = null; render(); }
  else if (act === 'delete') {
    const id = el.closest('form').dataset.id, t = find(id);
    if (!confirm(`Delete “${t.text}”? It goes to Notion’s trash, so you can still get it back there.`)) return;
    el.closest('.tcard').classList.add('saving');
    try { await api('/tasks/' + id, 'DELETE'); data.tasks = data.tasks.filter(x => x.id !== id); editing = null; render(); toast('Deleted.'); }
    catch (err) { el.closest('.tcard').classList.remove('saving'); toast('Not deleted: ' + err.message); }
  }
});
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.classList.contains('form')) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  v.text = v.text.trim(); v.detail = v.detail.trim(); v.link = v.link.trim();
  if (!v.text) return;
  f.closest('.tcard').classList.add('saving'); f.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    if (f.dataset.id) { await api('/tasks/' + f.dataset.id, 'PATCH', v); Object.assign(find(f.dataset.id), v); }
    else { const r = await api('/tasks', 'POST', { ...v, brand: f.dataset.brand }); data.tasks.push({ ...v, id: r.id, brand: f.dataset.brand, done: false, source: 'added on the site' }); }
    editing = null; toast('Saved to Notion.'); render();
  } catch (err) { f.closest('.tcard').classList.remove('saving'); f.querySelectorAll('button').forEach(b => b.disabled = false); toast('Not saved: ' + err.message); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && editing) { editing = null; render(); } });
</script>
</body>
</html>
