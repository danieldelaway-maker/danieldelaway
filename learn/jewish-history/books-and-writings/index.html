<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Books and writings · Jewish History</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap">
  <link rel="preload" as="image" href="/assets/bookshelf-tile.jpg">
  <style>
    /* Kanisah by Gunarta (freeware, fontspace.com/kanisah-font-f22290): Hebrew-style Latin letters */
    @font-face { font-family: "Kanisah"; src: url("/assets/fonts/kanisah.ttf") format("truetype"); font-display: swap; }

    html, body { margin: 0; height: 100%; overflow: hidden; background: #241309; color: #f3e3c3; font-family: "EB Garamond", Georgia, serif;
      user-select: none; -webkit-user-select: none; }
    a { color: inherit; }

    /* The bookshelf: one seamless tile (875 x 1120) repeated sideways forever, scaled to the screen height */
    .shelf { position: fixed; inset: 0; background: #241309 url("/assets/bookshelf-tile.jpg") 0 0 / auto 100% repeat-x;
      touch-action: none; cursor: grab; }
    .shelf.dragging { cursor: grabbing; }

    .top { position: fixed; top: 2.2dvh; left: max(3vw, calc(env(safe-area-inset-left) + 10px)); z-index: 5; display: flex; align-items: center; gap: 16px; }
    .back { text-decoration: none; font-size: 16px; line-height: 1; padding: 8px 16px 9px; border-radius: 999px;
      border: 1.5px solid rgba(243, 227, 195, .6); background: rgba(36, 19, 9, .45); transition: background .2s; }
    .back:hover { background: rgba(243, 227, 195, .15); }
    h1 { margin: 0; font: 400 28px "Kanisah", "EB Garamond", serif; letter-spacing: .02em; text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }

    /* Yad (Torah pointer) cursor on mouse devices, same as the rest of Jewish History */
    .yad { position: fixed; left: 0; top: 0; z-index: 20; width: 64px; height: 64px; margin: -1px 0 0 -2px; pointer-events: none;
      opacity: 0; transition: opacity .15s; will-change: transform; }
    .yad.on { opacity: 1; }
    @media (hover: hover) and (pointer: fine) { body.yadded, body.yadded * { cursor: none !important; } }
  </style>
</head>
<body>
  <img class="yad" id="yad" src="/assets/yad-cursor@2x.png?v=4" width="64" height="64" alt="" aria-hidden="true">
  <div class="shelf" id="shelf" aria-label="Bookshelf"></div>
  <div class="top">
    <a class="back" href="/learn/jewish-history/">Back</a>
    <h1>Books and Writings</h1>
  </div>

  <script>
    // Endless sideways scrolling: wheel, trackpad, drag or swipe moves the shelf; a flick keeps gliding and slows down
    const shelf = document.getElementById("shelf");
    let x = 0, v = 0, dragging = false, lastX = 0, lastT = 0, raf = 0;
    const render = () => { shelf.style.backgroundPositionX = -x + "px"; };
    function glide() {
      if (dragging || Math.abs(v) < .02) { raf = 0; return; }
      x += v * 16; v *= .94; render(); raf = requestAnimationFrame(glide);
    }
    shelf.addEventListener("wheel", ev => {
      ev.preventDefault();
      x += Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : ev.deltaY;
      v = 0; render();
    }, { passive: false });
    shelf.addEventListener("pointerdown", ev => {
      dragging = true; v = 0; lastX = ev.clientX; lastT = performance.now();
      shelf.setPointerCapture(ev.pointerId); shelf.classList.add("dragging");
    });
    shelf.addEventListener("pointermove", ev => {
      if (!dragging) return;
      const now = performance.now(), dx = ev.clientX - lastX;
      x -= dx; v = -dx / Math.max(1, now - lastT); lastX = ev.clientX; lastT = now; render();
    });
    const end = () => { if (!dragging) return; dragging = false; shelf.classList.remove("dragging"); if (!raf) raf = requestAnimationFrame(glide); };
    shelf.addEventListener("pointerup", end); shelf.addEventListener("pointercancel", end);
    addEventListener("keydown", ev => {
      if (ev.key === "ArrowRight") { x += innerWidth * .3; render(); }
      else if (ev.key === "ArrowLeft") { x -= innerWidth * .3; render(); }
    });

    // Yad follows the mouse (mouse devices only)
    if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
      const yad = document.getElementById("yad");
      document.body.classList.add("yadded");
      addEventListener("pointermove", e => { yad.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`; yad.classList.add("on"); }, { passive: true });
      document.addEventListener("mouseleave", () => yad.classList.remove("on"));
    } else document.getElementById("yad").remove();
  </script>
</body>
</html>
