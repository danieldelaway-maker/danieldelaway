<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline · Jewish History</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
    /* Kanisah by Gunarta (freeware, fontspace.com/kanisah-font-f22290): Hebrew-style Latin letters */
    @font-face { font-family: "Kanisah"; src: url("/assets/fonts/kanisah.ttf") format("truetype"); font-display: swap; }

    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: "EB Garamond", Georgia, serif; color: var(--ink); background: var(--base);
      -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
    a { color: inherit; }

    /* ---------- Background: Torah scroll on a wooden table (image 2000 x 853) ----------
       Covers the screen. The parchment runs from 5.5% to 93% of the image height, with lines of Hebrew
       at ~13.5% and ~86.5%, so the header sits just under the top line and the overview just above the bottom one. */
    body { --base: #2a170a; --ink: #3a2612; --muted: #7a5a36; --line: #6b4a26; --card: transparent; --card-line: transparent; --pop: #fbf1da; }
    .backdrop { position: fixed; inset: 0; pointer-events: none; background: #2a170a url("/assets/timeline-scroll.jpg") center / cover no-repeat; }
    button { background: rgba(255, 248, 230, .5); }

    /* Yad (Torah pointer) cursor on mouse devices, same as the Jewish History home page: the real cursor is hidden
       and a 64px image follows the mouse. The click point is the fingertip, at the image's top-left corner. */
    .yad { position: fixed; left: 0; top: 0; z-index: 20; width: 64px; height: 64px; margin: -1px 0 0 -2px; pointer-events: none;
      opacity: 0; transition: opacity .15s; will-change: transform; }
    .yad.on { opacity: 1; }
    @media (hover: hover) and (pointer: fine) {
      body.yadded, body.yadded * { cursor: none !important; }
    }

    /* ---------- Header and controls ---------- */
    .top { position: fixed; top: 15dvh; left: 4vw; right: 4vw; z-index: 8; display: flex; align-items: center; gap: 18px; padding: 0; pointer-events: none; }
    .top > * { pointer-events: auto; }
    .back { text-decoration: none; font-size: 17px; opacity: .8; }
    .back:hover { opacity: 1; }
    h1 { font-family: "Kanisah", "EB Garamond", serif; font-weight: 400; font-size: 34px; margin: 0; letter-spacing: .02em; }
    .spacer { flex: 1; }
    button { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
    /* Zoom controls: one ink-ruled bar, like a label stamped on the parchment */
    .zoom { display: flex; align-items: stretch; padding: 3px; border: 1.5px solid rgba(58, 38, 18, .75); border-radius: 999px;
      background: rgba(248, 236, 208, .35); box-shadow: inset 0 0 0 1px rgba(255, 246, 225, .45), 0 1px 0 rgba(255, 246, 225, .5); }
    .zoom button { display: grid; place-items: center; width: 42px; height: 36px; padding: 0; border: 0; border-radius: 999px;
      background: transparent; color: var(--ink); transition: background .2s, transform .15s; }
    .zoom button + button { position: relative; }
    .zoom button + button::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 1px; background: rgba(58, 38, 18, .35); }
    .zoom button:hover { background: rgba(58, 38, 18, .1); }
    .zoom button:active { transform: scale(.92); }
    .zoom button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
    .zoom svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Timeline ---------- */
    .stage { position: fixed; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden; touch-action: none; cursor: grab; }
    .stage.dragging { cursor: grabbing; }
    .axis { position: absolute; left: 0; right: 0; height: 2px; background: var(--line); opacity: .8; }
    .era { position: absolute; height: 28px; overflow: hidden; white-space: nowrap; box-shadow: inset 1px 0 0 rgba(251, 240, 214, .55);
      font-size: 14px; letter-spacing: .06em; text-transform: uppercase; line-height: 28px; font-size: 13px; color: #fbf0d6; text-shadow: 0 1px 1px rgba(0, 0, 0, .35); }
    .era b { position: absolute; top: 0; font-weight: 600; }
    .tick { position: absolute; width: 1px; height: 8px; background: var(--line); opacity: .7; }
    .tlabel { position: absolute; font-size: 16px; font-weight: 600; letter-spacing: .02em; color: var(--ink); transform: translateX(-50%); white-space: nowrap; }
    .stem { position: absolute; width: 1px; background: var(--line); opacity: .65; }
    .dot { position: absolute; width: 9px; height: 9px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--line); }
    .range { position: absolute; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--line); opacity: .55; }
    .card { position: absolute; max-width: 210px; padding: 6px 10px 7px; border-radius: 4px; cursor: pointer;
      background: var(--card); border: 1px solid var(--card-line); color: var(--ink); }
    .card .y { font-size: 13px; color: var(--muted); letter-spacing: .03em; }
    .card .t { font-size: 17px; line-height: 1.15; }
    .card.p1 .t { font-size: 19px; font-weight: 600; }
    .card:hover { outline: 2px solid var(--line); outline-offset: 1px; }

    /* Overview strip */
    .mini { position: fixed; left: 6vw; right: 6vw; bottom: 16dvh; height: 26px; z-index: 7; border-radius: 4px; overflow: hidden; cursor: pointer;
      border: 1px solid var(--line); touch-action: none; }
    .mini i { position: absolute; top: 0; bottom: 0; }
    .mini .win { position: absolute; top: -1px; bottom: -1px; border: 2px solid var(--ink); border-radius: 3px; background: rgba(255, 255, 255, .12); }

    /* Event detail */
    .pop { position: fixed; left: 50%; bottom: calc(16dvh + 40px); transform: translateX(-50%); z-index: 9; width: min(520px, calc(100vw - 32px)); box-sizing: border-box;
      padding: 16px 20px 18px; border-radius: 8px; background: var(--pop); color: var(--ink); border: 1px solid var(--line);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .35); display: none; user-select: text; -webkit-user-select: text; }
    .pop.on { display: block; }
    .pop .y { font-size: 15px; opacity: .7; }
    .pop h2 { font-size: 26px; margin: 2px 0 8px; font-weight: 600; line-height: 1.1; }
    .pop p { margin: 0; font-size: 18px; line-height: 1.4; }
    .pop .x { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 24px; color: inherit; }

    @media (max-width: 700px) {
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <img class="yad" id="yad" src="/assets/yad-cursor@2x.png?v=4" width="64" height="64" alt="" aria-hidden="true">
  <div class="backdrop"></div>

  <div class="stage" id="stage"></div>

  <div class="top">
    <a class="back" href="/learn/jewish-history/">← Back</a>
    <h1>Timeline</h1>
    <span class="spacer"></span>
    <div class="zoom">
      <button id="zout" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20 20M7.8 10.5h5.4"/></svg></button>
      <button id="zin" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20 20M7.8 10.5h5.4M10.5 7.8v5.4"/></svg></button>
      <button id="zfit" aria-label="Show the whole timeline" title="Show the whole timeline"><svg viewBox="0 0 24 24"><path d="M3 6v12M21 6v12M6.5 12h11M9 9l-2.5 3L9 15M15 9l2.5 3L15 15"/></svg></button>
    </div>
  </div>

  <div class="mini" id="mini"></div>
  <div class="pop" id="pop"><button class="x" aria-label="Close">×</button><div class="y"></div><h2></h2><p></p></div>

  <script>
    // Years: negative = BCE. c: circa. e: end year (draws a bar). p: 1 always shown, 2 shown when room, 3 only when zoomed in.
    const START = -2000, END = 2030;

    const ERAS = [
      [-1800, -1600, "Patriarchs"], [-1600, -1280, "Egypt"], [-1280, -1200, "Wilderness"], [-1200, -1050, "Judges"],
      [-1050, -930, "United Kingdom"], [-930, -586, "Two Kingdoms"], [-586, -538, "Exile"], [-538, -332, "Persian Period"],
      [-332, -167, "Greek Period"], [-167, -63, "Hasmoneans"], [-63, 70, "Roman Rule"], [70, 640, "Mishnah & Talmud"],
      [640, 1096, "Geonim & Golden Age"], [1096, 1492, "Medieval Europe"], [1492, 1789, "Early Modern"], [1789, 1881, "Emancipation"],
      [1881, 1933, "Migration & Zionism"], [1933, 1945, "Holocaust"], [1948, END, "State of Israel"]
    ];

    const EVENTS = [
      { y: -1800, c: 1, p: 1, t: "Abraham's covenant", d: "Abraham leaves Mesopotamia for Canaan. Tradition sees his covenant with God as the start of the Jewish people." },
      { y: -1650, c: 1, p: 2, t: "Jacob's family goes to Egypt", d: "Facing famine, Jacob and his sons settle in Egypt, where Joseph has risen to power." },
      { y: -1280, c: 1, p: 1, t: "The Exodus", d: "Moses leads the Israelites out of slavery in Egypt. Remembered every year at Passover." },
      { y: -1270, c: 1, p: 2, t: "Torah given at Sinai", d: "At Mount Sinai the Israelites receive the Ten Commandments and the Torah. Remembered at Shavuot." },
      { y: -1208, p: 2, t: "Merneptah Stele", d: "An Egyptian victory stone names \"Israel\". It's the oldest known mention of Israel outside the Bible." },
      { y: -1200, c: 1, p: 3, t: "Joshua enters Canaan", d: "After forty years in the wilderness, the tribes cross the Jordan into the land." },
      { y: -1050, c: 1, p: 2, t: "Saul, the first king", d: "The tribes ask for a king, and the prophet Samuel anoints Saul." },
      { y: -1000, c: 1, p: 1, t: "David takes Jerusalem", d: "King David captures Jerusalem and makes it his capital." },
      { y: -957, c: 1, p: 1, t: "First Temple built", d: "King Solomon completes the Temple in Jerusalem." },
      { y: -930, c: 1, p: 1, t: "The kingdom splits", d: "After Solomon dies, the kingdom divides: Israel in the north, Judah in the south." },
      { y: -870, c: 1, p: 3, t: "Elijah the prophet", d: "Elijah challenges King Ahab and the worship of Baal in the northern kingdom." },
      { y: -740, c: 1, p: 3, t: "Isaiah's prophecies", d: "Isaiah begins prophesying in Jerusalem, including his vision of swords beaten into ploughshares." },
      { y: -722, p: 1, t: "Assyria destroys Israel", d: "Assyria conquers the northern kingdom and deports its people. They become the \"ten lost tribes\"." },
      { y: -701, p: 2, t: "Siege of Jerusalem", d: "Sennacherib of Assyria besieges Jerusalem. King Hezekiah's water tunnel helps the city hold out." },
      { y: -622, p: 3, t: "Josiah's reforms", d: "A Torah scroll is found in the Temple, and King Josiah leads a religious revival." },
      { y: -586, p: 1, t: "First Temple destroyed", d: "Babylon destroys Jerusalem and the Temple and exiles much of Judah. Mourned on Tisha B'Av." },
      { y: -538, p: 1, t: "Cyrus lets the exiles return", d: "Persia's King Cyrus allows the Jews to go home and rebuild the Temple." },
      { y: -516, p: 1, t: "Second Temple dedicated", d: "The rebuilt Temple is dedicated in Jerusalem." },
      { y: -480, c: 1, p: 3, t: "The story of Esther", d: "In Persia, Queen Esther saves the Jews from Haman's plot. Celebrated at Purim." },
      { y: -458, c: 1, p: 2, t: "Ezra reads the Torah", d: "Ezra the scribe brings the Torah back to Jerusalem and reads it to the people." },
      { y: -332, p: 2, t: "Alexander the Great", d: "Alexander conquers the land, and Greek culture spreads across it." },
      { y: -250, c: 1, p: 3, t: "The Septuagint", d: "In Alexandria the Torah is translated into Greek, the first major translation of the Bible." },
      { y: -167, p: 2, t: "Maccabean revolt", d: "King Antiochus IV bans Judaism. The Maccabees rise up against him." },
      { y: -164, p: 1, t: "Temple rededicated", d: "The Maccabees retake Jerusalem and rededicate the Temple. Celebrated at Hanukkah." },
      { y: -63, p: 2, t: "Rome takes Jerusalem", d: "The Roman general Pompey captures Jerusalem, and Judea falls under Roman control." },
      { y: -37, p: 2, t: "Herod the Great", d: "Herod becomes king of Judea under Rome. He later rebuilds the Temple on a huge scale, including the Western Wall." },
      { y: -30, c: 1, p: 3, t: "Hillel and Shammai", d: "Two great sages whose schools shape Jewish law for centuries." },
      { y: 66, e: 73, p: 2, t: "Great Revolt", d: "Judea revolts against Rome. The revolt ends with the fall of Masada in 73 CE." },
      { y: 70, p: 1, t: "Second Temple destroyed", d: "Rome destroys Jerusalem and the Temple. Judaism carries on through prayer, study and the synagogue." },
      { y: 132, e: 135, p: 1, t: "Bar Kokhba revolt", d: "A last great revolt against Rome is crushed. Jews are banned from Jerusalem." },
      { y: 200, c: 1, p: 1, t: "The Mishnah", d: "Rabbi Judah the Prince writes down the Oral Law as the Mishnah." },
      { y: 400, c: 1, p: 3, t: "Jerusalem Talmud", d: "The sages of the Galilee complete the Jerusalem Talmud." },
      { y: 500, c: 1, p: 1, t: "Babylonian Talmud", d: "The Babylonian Talmud is completed. It becomes the core text of Jewish law and study." },
      { y: 638, p: 2, t: "Jews return to Jerusalem", d: "After the Arab conquest, Jews are allowed to live in Jerusalem again." },
      { y: 930, c: 1, p: 3, t: "Aleppo Codex", d: "The most accurate early manuscript of the Hebrew Bible is written in Tiberias." },
      { y: 950, c: 1, p: 2, t: "Golden Age in Spain", d: "Under Muslim rule in Spain, Jewish poetry, philosophy and science flourish." },
      { y: 1040, p: 2, t: "Rashi is born", d: "Rashi of Troyes writes the commentary on the Torah and Talmud that is still studied everywhere." },
      { y: 1096, p: 2, t: "First Crusade", d: "Crusaders massacre the Jewish communities of the Rhineland." },
      { y: 1138, p: 2, t: "Maimonides is born", d: "The philosopher, doctor and legal scholar who writes the Mishneh Torah and the Guide for the Perplexed." },
      { y: 1144, p: 3, t: "First blood libel", d: "In Norwich, England, Jews are falsely accused of ritual murder. The lie spreads across Europe." },
      { y: 1215, p: 3, t: "Jewish badge", d: "The Church orders Jews to wear clothing that marks them out." },
      { y: 1290, p: 2, t: "Expelled from England", d: "Edward I expels all Jews from England. They're not formally readmitted until 1656." },
      { y: 1306, p: 3, t: "Expelled from France", d: "Philip IV expels the Jews of France and seizes their property." },
      { y: 1348, p: 2, t: "Black Death massacres", d: "Jews are blamed for the plague, and hundreds of communities are destroyed." },
      { y: 1391, p: 3, t: "Riots in Spain", d: "Mobs attack Jewish communities across Spain, and many Jews are forced to convert." },
      { y: 1475, p: 3, t: "First Hebrew printed book", d: "Rashi's commentary on the Torah is printed in Reggio di Calabria, Italy." },
      { y: 1492, p: 1, t: "Expelled from Spain", d: "Ferdinand and Isabella expel every Jew who won't convert. Many go to the Ottoman Empire." },
      { y: 1497, p: 3, t: "Forced conversion in Portugal", d: "The Jews of Portugal are forcibly converted." },
      { y: 1516, p: 2, t: "First ghetto, Venice", d: "Venice walls its Jews into the Ghetto, giving the word to the world." },
      { y: 1565, p: 2, t: "Shulchan Aruch printed", d: "Joseph Karo's code of Jewish law is printed. It is still the standard guide." },
      { y: 1570, p: 3, t: "Luria in Safed", d: "Isaac Luria arrives in Safed, which becomes the centre of Kabbalah." },
      { y: 1648, p: 2, t: "Khmelnytsky massacres", d: "Cossack uprisings in Ukraine destroy hundreds of Jewish communities." },
      { y: 1654, p: 2, t: "First Jews in America", d: "23 Jews from Brazil arrive in New Amsterdam, later New York." },
      { y: 1665, p: 3, t: "Shabbetai Tzvi", d: "A self-proclaimed messiah wins a huge following, then converts to Islam in 1666." },
      { y: 1740, c: 1, p: 2, t: "Hasidism begins", d: "The Baal Shem Tov teaches joyful, heartfelt devotion in Eastern Europe." },
      { y: 1783, p: 3, t: "The Haskalah", d: "Moses Mendelssohn publishes \"Jerusalem\", and the Jewish Enlightenment gathers pace." },
      { y: 1791, p: 2, t: "Citizenship in France", d: "France becomes the first European country to grant Jews full citizenship." },
      { y: 1840, p: 3, t: "Damascus affair", d: "A blood libel in Damascus leads to an international Jewish campaign for justice." },
      { y: 1860, p: 3, t: "Outside the Old City walls", d: "Mishkenot Sha'ananim becomes the first Jewish neighbourhood outside Jerusalem's walls." },
      { y: 1881, p: 2, t: "Pogroms in Russia", d: "Waves of violence push millions of Jews to emigrate, mostly to America." },
      { y: 1882, p: 3, t: "First Aliyah", d: "The first modern wave of Jewish immigrants to the Land of Israel." },
      { y: 1894, p: 2, t: "Dreyfus affair", d: "A Jewish officer is falsely convicted of treason in France." },
      { y: 1897, p: 1, t: "First Zionist Congress", d: "Theodor Herzl gathers the Zionist movement in Basel to seek a Jewish homeland." },
      { y: 1909, p: 3, t: "Tel Aviv founded", d: "Families draw lots for plots on the sand dunes outside Jaffa." },
      { y: 1917, p: 2, t: "Balfour Declaration", d: "Britain backs \"a national home for the Jewish people\" in Palestine." },
      { y: 1933, p: 2, t: "Nazis take power", d: "Hitler becomes chancellor of Germany, and persecution of Jews begins at once." },
      { y: 1938, p: 3, t: "Kristallnacht", d: "Synagogues, shops and homes are attacked across Germany and Austria." },
      { y: 1941, e: 1945, p: 1, t: "The Holocaust", d: "Nazi Germany and its collaborators murder six million Jews." },
      { y: 1943, p: 3, t: "Warsaw Ghetto Uprising", d: "Jewish fighters hold out against the Germans for nearly a month." },
      { y: 1947, p: 3, t: "Dead Sea Scrolls found", d: "Shepherds find ancient scrolls in caves at Qumran, some over 2,000 years old." },
      { y: 1948, p: 1, t: "State of Israel", d: "David Ben-Gurion declares independence on 14 May. Five Arab armies invade the next day." },
      { y: 1949, e: 1950, p: 3, t: "Operation Magic Carpet", d: "Almost the whole Jewish community of Yemen is airlifted to Israel." },
      { y: 1961, p: 3, t: "Eichmann trial", d: "Holocaust organiser Adolf Eichmann is tried in Jerusalem." },
      { y: 1967, p: 1, t: "Six-Day War", d: "Israel defeats three armies, and Jerusalem is reunited under Jewish rule." },
      { y: 1973, p: 2, t: "Yom Kippur War", d: "Egypt and Syria launch a surprise attack on the holiest day of the year." },
      { y: 1976, p: 3, t: "Entebbe raid", d: "Israeli commandos rescue hostages from a hijacked plane in Uganda." },
      { y: 1979, p: 3, t: "Peace with Egypt", d: "Israel and Egypt sign a peace treaty." },
      { y: 1989, e: 1991, p: 2, t: "Soviet aliyah", d: "Hundreds of thousands of Soviet Jews move to Israel as the USSR collapses." },
      { y: 1991, p: 3, t: "Operation Solomon", d: "In 36 hours, Israel airlifts over 14,000 Ethiopian Jews." },
      { y: 2023, p: 2, t: "7 October attack", d: "Hamas attacks southern Israel. It is the deadliest day for Jews since the Holocaust." }
    ];

    const $ = s => document.querySelector(s);
    const stage = $("#stage"), mini = $("#mini"), pop = $("#pop"), topBar = $(".top");
    const fmt = y => y < 0 ? `${-y} BCE` : y < 1000 ? `${y} CE` : `${y}`;
    const when = e => (e.c ? "c. " : "") + (e.e ? `${fmt(e.y).replace(/ (BCE|CE)$/, (e.y < 0) === (e.e < 0) ? "" : " $1")}–${fmt(e.e)}` : fmt(e.y));

    let W = 0, H = 0, k = 1, x0 = START;
    const minK = () => W / (END - START);
    const X = y => (y - x0) * k;
    function clamp() {
      k = Math.max(minK(), Math.min(400, k));
      x0 = Math.max(START, Math.min(END - W / k, x0));
    }
    function zoomAt(px, f) { const y = x0 + px / k; k *= f; clamp(); x0 = y - px / k; clamp(); }

    // Build every element once; draw() only moves and shows/hides them.
    const axis = document.createElement("div"); axis.className = "axis"; stage.appendChild(axis);
    const eraEls = ERAS.map(([a, b, name], i) => {
      const el = document.createElement("div"); el.className = "era";
      // Rich manuscript inks: madder red, indigo, ochre, verdigris, plum, olive
      el.style.background = ["#9a3324", "#2e4a7d", "#b5831f", "#2f6f68", "#6e3b68", "#5f6d22"][i % 6];
      el.innerHTML = `<b>${name}</b>`; stage.appendChild(el); return el;
    });
    const tickPool = [];
    EVENTS.forEach(e => {
      e.card = document.createElement("div"); e.card.className = `card p${e.p}`;
      e.card.innerHTML = `<div class="y">${when(e)}</div><div class="t">${e.t}</div>`;
      e.stem = document.createElement("div"); e.stem.className = "stem";
      e.dot = document.createElement("div"); e.dot.className = e.e ? "range" : "dot";
      stage.append(e.stem, e.dot, e.card);
      e.card.addEventListener("click", ev => { if (!moved) open(e); ev.stopPropagation(); });
    });
    // Measure at the left edge so cards near the right side don't get squeezed, then fix the width
    function measure() {
      EVENTS.forEach(e => { Object.assign(e.card.style, { display: "", left: "0px", width: "" }); });
      EVENTS.forEach(e => { e.w = Math.ceil(e.card.getBoundingClientRect().width); e.h = e.card.offsetHeight; });
      EVENTS.forEach(e => { e.card.style.width = e.w + "px"; e.card.style.boxSizing = "border-box"; });
    }

    // Eras get their own ribbon just above the overview strip, so no line or stem ever runs through a name
    const LANE = 74, BAND = 4, ERA_H = 28;
    function draw() {
      const axisY = Math.round(H * .5);
      axis.style.top = axisY - 1 + "px";
      const headBottom = topBar.getBoundingClientRect().bottom + 10, miniTop = mini.getBoundingClientRect().top;
      const eraTop = miniTop - 10 - ERA_H;

      eraEls.forEach((el, i) => {
        const [a, b] = ERAS[i], l = X(a), r = X(b);
        if (r < 0 || l > W) { el.style.display = "none"; return; }
        el.style.display = ""; el.style.left = l + "px"; el.style.width = (r - l) + "px"; el.style.top = eraTop + "px";
        // Centre the name in the part of the era that's on screen
        const lab = el.firstChild, lw = lab.offsetWidth, mid = (Math.max(l, 0) + Math.min(r, W)) / 2 - l;
        lab.style.visibility = (r - l) > lw + 16 ? "" : "hidden";
        lab.style.left = Math.min(Math.max(8, mid - lw / 2), r - l - lw - 8) + "px";
      });

      // Ticks: pick the smallest step that keeps labels ~110px apart
      const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => s * k >= 110) || 1000;
      let n = 0;
      for (let t = Math.ceil(x0 / step) * step; t <= x0 + W / k; t += step, n++) {
        if (!tickPool[n]) { const a = document.createElement("div"), b = document.createElement("div"); a.className = "tick"; b.className = "tlabel"; stage.append(a, b); tickPool[n] = [a, b]; }
        const [a, b] = tickPool[n], x = X(t);
        a.style.display = b.style.display = "";
        a.style.left = x + "px"; a.style.top = axisY + BAND / 2 + "px";
        b.style.left = x + "px"; b.style.top = axisY + BAND / 2 + 9 + "px";
        b.textContent = t === 0 ? "BCE | CE" : fmt(t);
      }
      for (; n < tickPool.length; n++) tickPool[n][0].style.display = tickPool[n][1].style.display = "none";

      // Lanes: above the axis and below the tick labels, kept clear of the header and the era ribbon.
      // Bigger events claim space first.
      const above = Math.max(1, Math.min(5, Math.floor((axisY - BAND / 2 - 14 - headBottom) / LANE)));
      const belowTop = axisY + BAND / 2 + 40;
      const below = Math.max(1, Math.min(5, Math.floor((eraTop - 10 - belowTop) / LANE)));
      const lanes = [];
      for (let i = 0; i < Math.max(above, below); i++) { if (i < above) lanes.push({ up: 1, i, used: [] }); if (i < below) lanes.push({ up: 0, i, used: [] }); }
      const order = EVENTS.slice().sort((a, b) => a.p - b.p || a.y - b.y);
      for (const e of order) {
        const x = X(e.y), xe = e.e ? X(e.e) : x;
        e.lane = null;
        if (e.p === 3 && k < 2) { hide(e); continue; }
        if (xe < 0 || x > W) { hide(e); continue; }
        const flip = x + e.w > W - 6, l = flip ? x - e.w - 14 : x - 4, r = flip ? x + 4 : x + e.w + 14;
        e.lane = lanes.find(L => L.used.every(([a, b]) => r < a || l > b));
        if (!e.lane) { hide(e); continue; }
        e.lane.used.push([l, r]);
        const L = e.lane, top = L.up ? axisY - BAND / 2 - 14 - L.i * LANE - e.h : belowTop + L.i * LANE;
        Object.assign(e.card.style, { display: "", left: (flip ? x - e.w + 1 : x - 1) + "px", top: top + "px" });
        Object.assign(e.stem.style, { display: "", left: x + "px", top: (L.up ? top + e.h : axisY) + "px", height: (L.up ? axisY - top - e.h : top - axisY) + "px" });
        Object.assign(e.dot.style, { display: "", left: x + (e.e ? 0 : 0) + "px", top: axisY + "px", width: e.e ? Math.max(9, xe - x) + "px" : "" });
      }
      drawMini();
    }
    function hide(e) { e.card.style.display = e.stem.style.display = e.dot.style.display = "none"; }

    // Overview strip
    const miniWin = document.createElement("div"); miniWin.className = "win";
    ERAS.forEach(([a, b], i) => { const el = document.createElement("i"); el.style.left = (a - START) / (END - START) * 100 + "%"; el.style.width = (b - a) / (END - START) * 100 + "%"; el.style.background = eraEls[i].style.background; mini.appendChild(el); });
    mini.appendChild(miniWin);
    function drawMini() { miniWin.style.left = (x0 - START) / (END - START) * 100 + "%"; miniWin.style.width = Math.max(.6, (W / k) / (END - START) * 100) + "%"; }
    function miniJump(ev) { const r = mini.getBoundingClientRect(), y = START + (ev.clientX - r.left) / r.width * (END - START); x0 = y - W / k / 2; clamp(); draw(); }
    mini.addEventListener("pointerdown", ev => { mini.setPointerCapture(ev.pointerId); miniJump(ev); mini.onpointermove = miniJump; });
    mini.addEventListener("pointerup", () => { mini.onpointermove = null; });

    // Zoom and pan
    stage.addEventListener("wheel", ev => {
      ev.preventDefault();
      const px = ev.clientX - stage.getBoundingClientRect().left;
      if (ev.ctrlKey) zoomAt(px, Math.exp(-ev.deltaY * .012));
      else if (Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) { x0 += ev.deltaX / k; clamp(); }
      else zoomAt(px, Math.exp(-ev.deltaY * .0018));
      draw();
    }, { passive: false });

    const pts = new Map(); let moved = false, pinch = null;
    stage.addEventListener("pointerdown", ev => {
      pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); moved = false;
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.abs(a.x - b.x); }
    });
    addEventListener("pointermove", ev => {
      if (!pts.has(ev.pointerId)) return;
      const p = pts.get(ev.pointerId), dx = ev.clientX - p.x;
      if (Math.abs(dx) > 3 || Math.abs(ev.clientY - p.y) > 3) { moved = true; stage.classList.add("dragging"); }
      if (pts.size === 1) { if (moved) { x0 -= dx / k; clamp(); p.x = ev.clientX; p.y = ev.clientY; draw(); } }
      else if (pts.size === 2) {
        p.x = ev.clientX; p.y = ev.clientY;
        const [a, b] = [...pts.values()], d = Math.abs(a.x - b.x), mid = (a.x + b.x) / 2 - stage.getBoundingClientRect().left;
        if (pinch && d > 10) zoomAt(mid, d / pinch); pinch = d; draw();
      }
    });
    const up = ev => { pts.delete(ev.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) stage.classList.remove("dragging"); };
    addEventListener("pointerup", up); addEventListener("pointercancel", up);
    stage.addEventListener("click", () => { if (!moved) pop.classList.remove("on"); });

    function animateZoom(f) {
      const target = Math.max(minK(), Math.min(400, k * f)), from = k, t0 = performance.now();
      const stepFn = now => { const t = Math.min(1, (now - t0) / 280), e = 1 - Math.pow(1 - t, 3); zoomAt(W / 2, from * Math.pow(target / from, e) / k); draw(); if (t < 1) requestAnimationFrame(stepFn); };
      requestAnimationFrame(stepFn);
    }
    $("#zin").onclick = () => animateZoom(2);
    $("#zout").onclick = () => animateZoom(.5);
    $("#zfit").onclick = () => animateZoom(minK() / k);
    addEventListener("keydown", ev => {
      if (ev.key === "+" || ev.key === "=") animateZoom(2);
      else if (ev.key === "-") animateZoom(.5);
      else if (ev.key === "0") animateZoom(minK() / k);
      else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") { x0 += (ev.key === "ArrowRight" ? 1 : -1) * W * .25 / k; clamp(); draw(); }
      else if (ev.key === "Escape") pop.classList.remove("on");
    });

    function open(e) {
      pop.querySelector(".y").textContent = when(e);
      pop.querySelector("h2").textContent = e.t;
      pop.querySelector("p").textContent = e.d;
      pop.classList.add("on");
    }
    pop.querySelector(".x").onclick = () => pop.classList.remove("on");

    function resize() {
      const keep = W ? { mid: x0 + W / k / 2, span: W / k } : null;
      W = stage.clientWidth; H = stage.clientHeight;
      if (keep) { k = W / keep.span; x0 = keep.mid - keep.span / 2; } else { k = minK(); x0 = START; }
      clamp(); draw();
    }
    addEventListener("resize", resize);

    // Yad follows the mouse (mouse devices only)
    if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
      const yad = $("#yad");
      document.body.classList.add("yadded");
      addEventListener("pointermove", e => { yad.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`; yad.classList.add("on"); }, { passive: true });
      document.addEventListener("mouseleave", () => yad.classList.remove("on"));
    } else $("#yad").remove();

    resize(); measure(); draw();
    document.fonts.ready.then(() => { measure(); draw(); });
  </script>
</body>
</html>
