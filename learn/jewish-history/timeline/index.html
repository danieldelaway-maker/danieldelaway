<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline · Jewish History</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
    /* Kanisah by Gunarta (freeware, fontspace.com/kanisah-font-f22290): Hebrew-style Latin letters */
    @font-face { font-family: "Kanisah"; src: url("/assets/fonts/kanisah.ttf") format("truetype"); font-display: swap; }

    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: "EB Garamond", Georgia, serif; color: var(--ink); background: var(--base);
      -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
    a { color: inherit; }

    /* ---------- Background: Torah scroll on a wooden table (image 2000 x 853) ----------
       Covers the screen. The parchment runs from 5.5% to 93% of the image height, with lines of Hebrew
       at ~13.5% and ~86.5%, so the header sits just under the top line and the overview just above the bottom one. */
    body { --base: #2a170a; --ink: #3a2612; --muted: #7a5a36; --line: #6b4a26; --card: transparent; --card-line: transparent; --pop: #fbf1da; }
    .backdrop { position: fixed; inset: 0; pointer-events: none; background: #2a170a url("/assets/timeline-scroll.jpg") center / cover no-repeat; }
    button { background: rgba(255, 248, 230, .5); }

    /* Yad (Torah pointer) cursor on mouse devices, same as the Jewish History home page: the real cursor is hidden
       and a 64px image follows the mouse. The click point is the fingertip, at the image's top-left corner. */
    .yad { position: fixed; left: 0; top: 0; z-index: 20; width: 64px; height: 64px; margin: -1px 0 0 -2px; pointer-events: none;
      opacity: 0; transition: opacity .15s; will-change: transform; }
    .yad.on { opacity: 1; }
    @media (hover: hover) and (pointer: fine) {
      body.yadded, body.yadded * { cursor: none !important; }
    }

    /* ---------- Header and controls ---------- */
    .top { position: fixed; top: 15dvh; left: 4vw; right: 4vw; z-index: 8; display: flex; align-items: center; gap: 18px; padding: 0; pointer-events: none; }
    .top > * { pointer-events: auto; }
    /* Back link sits in the strip of parchment above the top line of Hebrew; the title takes its old place */
    .back { position: fixed; top: 7dvh; left: 4vw; text-decoration: none; font-size: 17px; opacity: .8; }
    .back:hover { opacity: 1; }
    h1 { font-family: "Kanisah", "EB Garamond", serif; font-weight: 400; font-size: 34px; margin: 0; letter-spacing: .02em; }
    .spacer { flex: 1; }
    button { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
    /* Zoom controls: one ink-ruled bar, like a label stamped on the parchment */
    .zoom { display: flex; align-items: stretch; padding: 3px; border: 1.5px solid rgba(58, 38, 18, .75); border-radius: 999px;
      background: rgba(248, 236, 208, .35); box-shadow: inset 0 0 0 1px rgba(255, 246, 225, .45), 0 1px 0 rgba(255, 246, 225, .5); }
    .zoom button { display: grid; place-items: center; width: 42px; height: 36px; padding: 0; border: 0; border-radius: 999px;
      background: transparent; color: var(--ink); transition: background .2s, transform .15s; }
    .zoom button + button { position: relative; }
    .zoom button + button::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 1px; background: rgba(58, 38, 18, .35); }
    .zoom button:hover { background: rgba(58, 38, 18, .1); }
    .zoom button:active { transform: scale(.92); }
    .zoom button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
    .zoom svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Timeline ---------- */
    .stage { position: fixed; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden; touch-action: none; cursor: grab; }
    .stage.dragging { cursor: grabbing; }
    .axis { position: absolute; left: 0; right: 0; height: 2px; background: var(--line); opacity: .8; }
    .era { position: absolute; height: 28px; overflow: hidden; white-space: nowrap; box-shadow: inset 1px 0 0 rgba(251, 240, 214, .55);
      font-size: 14px; letter-spacing: .06em; text-transform: uppercase; line-height: 28px; font-size: 13px; color: #fbf0d6; text-shadow: 0 1px 1px rgba(0, 0, 0, .35); }
    .era b { position: absolute; top: 0; font-weight: 600; }
    .era { cursor: pointer; transition: filter .15s; }
    .era:hover { filter: brightness(1.15) saturate(1.1); }

    /* Era summary on hover */
    .tip { position: fixed; z-index: 10; width: 320px; padding: 12px 16px 13px; border-radius: 8px; pointer-events: none;
      background: var(--pop); color: var(--ink); border: 1px solid var(--line); border-top: 5px solid var(--c, var(--line));
      box-shadow: 0 8px 30px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .15s; }
    .tip.on { opacity: 1; }
    .tip .d { font-size: 14px; font-weight: 600; opacity: .7; letter-spacing: .03em; }
    .tip h3 { margin: 1px 0 5px; font-size: 22px; font-weight: 600; line-height: 1.1; }
    .tip p { margin: 0; font-size: 16px; line-height: 1.4; }
    .tip .go { margin-top: 7px; font-size: 13px; font-style: italic; opacity: .7; }
    .tick { position: absolute; width: 1px; height: 8px; background: var(--line); opacity: .7; }
    .tlabel { position: absolute; font-size: 16px; font-weight: 600; letter-spacing: .02em; color: var(--ink); white-space: nowrap; }
    .stem { position: absolute; width: 1px; background: var(--line); opacity: .65; }
    .dot { position: absolute; width: 9px; height: 9px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--line); }
    .range { position: absolute; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--line); opacity: .55; }
    .card { position: absolute; max-width: 210px; padding: 6px 10px 7px; border-radius: 4px; cursor: pointer;
      background: var(--card); border: 1px solid var(--card-line); color: var(--ink); }
    .card .y { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: .03em; opacity: .85; }
    .card .t { font-size: 17px; line-height: 1.15; }
    .card.p1 .t { font-size: 19px; font-weight: 600; }
    .card.flip { text-align: right; }
    .card:hover { outline: 2px solid var(--line); outline-offset: 1px; }

    /* Overview strip */
    .mini { position: fixed; left: 6vw; right: 6vw; bottom: 16dvh; height: 26px; z-index: 7; border-radius: 4px; overflow: hidden; cursor: pointer;
      border: 1px solid var(--line); touch-action: none; }
    .mini i { position: absolute; top: 0; bottom: 0; }
    .mini .win { position: absolute; top: -1px; bottom: -1px; border: 2px solid var(--ink); border-radius: 3px; background: rgba(255, 255, 255, .12); }

    /* Event detail */
    .pop { position: fixed; left: 50%; bottom: calc(16dvh + 40px); transform: translateX(-50%); z-index: 9; width: min(760px, calc(100vw - 32px)); box-sizing: border-box;
      padding: 16px 20px 18px; border-radius: 8px; background: var(--pop); color: var(--ink); border: 1px solid var(--line);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .35); display: none; max-height: calc(84dvh - 60px); overflow-y: auto; user-select: text; -webkit-user-select: text; }
    .pop.on { display: block; }
    .pop.on.has-img { display: grid; grid-template-columns: 280px 1fr; gap: 0 20px; align-items: start; }
    .pop figure { margin: 0; }
    .pop .txt { padding-top: 6px; }
    /* Fixed-size frame: the whole image fits inside it, never cropped */
    .pop figure img { display: block; width: 280px; height: 210px; object-fit: contain; background: #e6d6b2; border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(58, 38, 18, .2); }
    .pop figcaption { margin-top: 4px; font-size: 12px; line-height: 1.3; opacity: .65; }
    .pop figcaption a { text-decoration: none; }
    .pop figcaption a:hover { text-decoration: underline; }
    .pop .y, .pop h2 { padding-right: 28px; }
    @media (max-width: 640px) {
      .pop.on.has-img { display: block; }
      .pop figure img { width: 100%; height: 180px; }
      .pop figure { margin-bottom: 10px; }
    }
    .pop .y { font-size: 15px; opacity: .7; }
    .pop h2 { font-size: 26px; margin: 2px 0 8px; font-weight: 600; line-height: 1.1; }
    .pop p { margin: 0; font-size: 17px; line-height: 1.45; }
    .pop .x { position: absolute; z-index: 2; top: 6px; right: 8px; width: 40px; height: 40px; cursor: pointer; border: 0; background: none; font-size: 24px; color: inherit; }

    @media (max-width: 700px) {
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <img class="yad" id="yad" src="/assets/yad-cursor@2x.png?v=4" width="64" height="64" alt="" aria-hidden="true">
  <div class="backdrop"></div>

  <div class="stage" id="stage"></div>

  <div class="top">
    <a class="back" href="/learn/jewish-history/">← Back</a>
    <h1>Timeline</h1>
    <span class="spacer"></span>
    <div class="zoom">
      <button id="zout" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20 20M7.8 10.5h5.4"/></svg></button>
      <button id="zin" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20 20M7.8 10.5h5.4M10.5 7.8v5.4"/></svg></button>
      <button id="zfit" aria-label="Show the whole timeline" title="Show the whole timeline"><svg viewBox="0 0 24 24"><path d="M3 6v12M21 6v12M6.5 12h11M9 9l-2.5 3L9 15M15 9l2.5 3L15 15"/></svg></button>
    </div>
  </div>

  <div class="mini" id="mini"></div>
  <div class="tip" id="tip" aria-hidden="true"></div>
  <div class="pop" id="pop"><button class="x" aria-label="Close">×</button><figure><img alt=""><figcaption></figcaption></figure><div class="txt"><div class="y"></div><h2></h2><p></p></div></div>

  <script>
    // Years: negative = BCE. c: circa. e: end year (draws a bar). p: 1 always shown, 2 shown when room, 3 only when zoomed in.
    const START = -2000, END = 2030;

    const ERAS = [
      [START, -1600, "Patriarchs"], [-1600, -1280, "Egypt"], [-1280, -1200, "Wilderness"], [-1200, -1050, "Judges"],
      [-1050, -930, "United Kingdom"], [-930, -586, "Two Kingdoms"], [-586, -538, "Exile"], [-538, -332, "Persian Period"],
      [-332, -167, "Greek Period"], [-167, -63, "Hasmoneans"], [-63, 70, "Roman Rule"], [70, 640, "Mishnah & Talmud"],
      [640, 1096, "Geonim & Golden Age"], [1096, 1492, "Medieval Europe"], [1492, 1789, "Early Modern"], [1789, 1881, "Emancipation"],
      [1881, 1933, "Migration & Zionism"], [1933, 1945, "Holocaust"], [1945, 1948, "Aftermath"], [1948, END, "State of Israel"]
    ];

    // Shown when hovering an era in the ribbon: [dates, summary]
    const ERA_INFO = {
      "Patriarchs": ["c. 1800–1600 BCE", "Abraham, Isaac and Jacob, the founding fathers of the Jewish people, live as herders in Canaan. God's covenant with Abraham promises his descendants the land."],
      "Egypt": ["c. 1600–1280 BCE", "Jacob's family settles in Egypt during a famine and grows into the twelve tribes of Israel, until a new Pharaoh enslaves them."],
      "Wilderness": ["c. 1280–1200 BCE", "Moses leads the Israelites out of Egypt. They receive the Torah at Sinai and wander the desert for forty years before reaching the Promised Land."],
      "Judges": ["c. 1200–1050 BCE", "The tribes settle the land under Joshua and are led in times of crisis by judges like Deborah, Gideon, Samson and Samuel."],
      "United Kingdom": ["c. 1050–930 BCE", "Saul, David and Solomon rule all twelve tribes. David makes Jerusalem the capital and Solomon builds the First Temple."],
      "Two Kingdoms": ["c. 930–586 BCE", "The nation splits into Israel in the north and Judah in the south. Prophets like Elijah and Isaiah warn the kings. Assyria destroys Israel, then Babylon conquers Judah."],
      "Exile": ["586–538 BCE", "Babylon destroys Jerusalem and the First Temple and takes the people into exile, where Judaism learns to survive without a Temple or a land."],
      "Persian Period": ["538–332 BCE", "Persia lets the exiles go home. They rebuild the Temple, Ezra teaches the Torah to the people, and Queen Esther saves the Jews of Persia."],
      "Greek Period": ["332–167 BCE", "Alexander the Great conquers the region and Greek culture spreads. The Torah is translated into Greek, and tensions grow between traditional and Hellenised Jews."],
      "Hasmoneans": ["167–63 BCE", "The Maccabees revolt against a Greek king who bans Judaism, rededicate the Temple (Hanukkah) and found an independent Jewish kingdom."],
      "Roman Rule": ["63 BCE–70 CE", "Rome takes control. Herod rebuilds the Temple on a grand scale, but heavy-handed rule sparks the Great Revolt, ending in the Temple's destruction."],
      "Mishnah & Talmud": ["70–640 CE", "With the Temple gone, rabbis rebuild Judaism around study and prayer. They write down the Oral Law as the Mishnah, then the great discussions of the Talmud."],
      "Geonim & Golden Age": ["640–1096", "Under Muslim rule, the academies of Babylonia lead the Jewish world, and Jewish poetry, philosophy and science flourish in Spain."],
      "Medieval Europe": ["1096–1492", "Great scholars like Rashi and Maimonides write, but Jews in Christian Europe suffer crusades, blood libels and expulsions, ending with Spain in 1492."],
      "Early Modern": ["1492–1789", "Exiles rebuild in the Ottoman Empire, Italy, Amsterdam and Poland. Ghettos, Kabbalah in Safed, false messiahs and the birth of Hasidism shape the era."],
      "Emancipation": ["1789–1881", "Starting with France, Jews in Western Europe gain equal rights as citizens. Many enter modern society, and the Jewish Enlightenment spreads."],
      "Migration & Zionism": ["1881–1933", "Pogroms drive millions of Jews from Eastern Europe to America. The Zionist movement begins, and pioneers build new towns in the Land of Israel."],
      "Holocaust": ["1933–1945", "Nazi Germany persecutes and then sets out to destroy Europe's Jews. Six million are murdered."],
      "Aftermath": ["1945–1948", "Survivors search for family and live in displaced persons camps. Many try to reach Palestine despite British limits, and the UN votes to divide the land."],
      "State of Israel": ["1948–today", "Israel is founded and takes in Jews from around the world. It fights wars, makes peace with some neighbours, and builds a thriving modern country."]
    };

    const EVENTS = [
      { y: -1800, c: 1, p: 1, t: "Abraham's covenant", d: "Abraham leaves the city of Ur in Mesopotamia and travels to Canaan with his wife Sarah and his household. In the Torah, God promises him that his descendants will become a great nation and inherit the land. The sign of this covenant is circumcision, still practised today. Abraham is seen as the first patriarch of the Jewish people, and his son Isaac and grandson Jacob carry the promise forward." },
      { y: -1650, c: 1, p: 2, t: "Jacob's family goes to Egypt", d: "Jacob's son Joseph, sold into slavery by his jealous brothers, rises to become a powerful official in Egypt. When a great famine strikes Canaan, the brothers come to Egypt for food and Joseph reveals who he is. Jacob and the whole family, about seventy people, settle in the region of Goshen. Over the following generations they grow into the twelve tribes of Israel, named after Jacob's sons." },
      { y: -1280, c: 1, p: 1, t: "The Exodus", d: "A new Pharaoh enslaves the Israelites and orders their baby boys killed. Moses, raised in the palace, is called by God at the burning bush to lead his people out. After ten plagues strike Egypt, Pharaoh lets them go, and the sea parts for them to cross. The Exodus is the founding story of the Jewish people and is retold every year at the Passover Seder." },
      { y: -1270, c: 1, p: 2, t: "Torah given at Sinai", d: "Seven weeks after leaving Egypt, the Israelites camp at the foot of Mount Sinai. Moses climbs the mountain and comes down with the Ten Commandments on two stone tablets. Jewish tradition holds that the whole Torah, written and oral, was given here. The moment turned a group of freed slaves into a people bound by law, and it is celebrated each year at Shavuot." },
      { y: -1208, p: 2, t: "Merneptah Stele", d: "This granite slab was carved for Pharaoh Merneptah to boast of his military victories in Canaan. One line says: \"Israel is laid waste, its seed is not.\" It is the oldest known mention of Israel outside the Bible, showing that a people called Israel already lived in the land by around 1208 BCE. The stele was found in Thebes in 1896 and is now in the Egyptian Museum in Cairo." },
      { y: -1200, c: 1, p: 3, t: "Joshua enters Canaan", d: "After forty years in the wilderness, Moses dies within sight of the Promised Land. His successor Joshua leads the tribes across the Jordan River, which the Bible says stopped flowing as the priests carried the Ark of the Covenant into it. The walls of Jericho fall, and the land is gradually settled and divided among the twelve tribes. For the next two centuries the tribes are led by judges rather than kings." },
      { y: -1050, c: 1, p: 2, t: "Saul, the first king", d: "Facing constant attacks from the Philistines, the tribes ask the prophet Samuel to give them a king like other nations. Samuel warns them against it, but anoints Saul, a tall young man from the tribe of Benjamin. Saul wins important battles but later falls out with Samuel and grows jealous of the young hero David. He dies fighting the Philistines on Mount Gilboa." },
      { y: -1000, c: 1, p: 1, t: "David takes Jerusalem", d: "David, the shepherd who defeated Goliath, becomes king of all the tribes. He captures Jerusalem from the Jebusites and makes it his capital, a neutral city between north and south. He brings the Ark of the Covenant there, turning Jerusalem into the religious heart of the nation. Ever since, Jerusalem has been called the City of David, and Jewish tradition says the Messiah will come from his line." },
      { y: -957, c: 1, p: 1, t: "First Temple built", d: "David's son Solomon builds a great Temple on Mount Moriah in Jerusalem, using cedar wood from Lebanon and skilled workers from Tyre. It takes seven years. The Ark of the Covenant is placed in its innermost room, the Holy of Holies. For nearly four centuries the Temple is the centre of Jewish worship, where sacrifices are offered and pilgrims come three times a year." },
      { y: -930, c: 1, p: 1, t: "The kingdom splits", d: "When Solomon dies, his son Rehoboam refuses to lower the heavy taxes and forced labour. Ten northern tribes break away under Jeroboam and form the Kingdom of Israel, with its capital later at Samaria. Only Judah and Benjamin stay loyal to David's line, forming the Kingdom of Judah with Jerusalem as its capital. The two kingdoms sometimes fight each other and sometimes ally for the next two hundred years." },
      { y: -870, c: 1, p: 3, t: "Elijah the prophet", d: "Elijah confronts King Ahab and Queen Jezebel, who have brought the worship of the god Baal into the northern kingdom. On Mount Carmel he challenges 450 prophets of Baal to a contest, and fire falls from heaven onto his altar alone. The Bible says he never died but was carried to heaven in a chariot of fire. A cup of wine is poured for him at every Passover Seder, and he is said to announce the Messiah." },
      { y: -740, c: 1, p: 3, t: "Isaiah's prophecies", d: "Isaiah prophesies in Jerusalem for about forty years, through the reigns of four kings of Judah. He warns the people against injustice and empty ritual, but also gives some of the Bible's most famous visions of hope. He describes a time when nations will beat their swords into ploughshares and the wolf will lie down with the lamb. A complete scroll of Isaiah was found among the Dead Sea Scrolls." },
      { y: -722, p: 1, t: "Assyria destroys Israel", d: "The Assyrian Empire, the superpower of its day, besieges Samaria for three years and finally destroys the northern Kingdom of Israel. Tens of thousands of Israelites are deported to distant parts of the empire, and foreign peoples are settled in their place. The deported tribes disappear from history and become known as the ten lost tribes. Only the southern Kingdom of Judah survives." },
      { y: -701, p: 2, t: "Siege of Jerusalem", d: "The Assyrian king Sennacherib invades Judah, destroys the fortress city of Lachish and surrounds Jerusalem. King Hezekiah had prepared by digging a 533-metre tunnel through solid rock to bring spring water inside the city walls. The Bible says an angel struck down the Assyrian army and Jerusalem was saved. Hezekiah's Tunnel can still be walked through today, and Sennacherib's carvings of Lachish are in the British Museum." },
      { y: -622, p: 3, t: "Josiah's reforms", d: "During repairs to the Temple, the high priest finds a long-lost scroll of the Torah, thought to be the Book of Deuteronomy. When it is read to young King Josiah, he tears his clothes in grief at how far the people have strayed. He removes idols from the land, destroys shrines to other gods and holds a great Passover in Jerusalem. He is remembered as one of the most righteous kings of Judah." },
      { y: -586, p: 1, t: "First Temple destroyed", d: "After a long siege, the Babylonian army under Nebuchadnezzar breaks into Jerusalem. They burn Solomon's Temple, tear down the city walls and take the king and most of the leading families into exile in Babylon. The Ark of the Covenant is never seen again. The destruction is mourned every year on the fast of Tisha B'Av, and the exile gave rise to the words \"By the rivers of Babylon, there we sat and wept.\"" },
      { y: -538, p: 1, t: "Cyrus lets the exiles return", d: "Cyrus the Great of Persia conquers Babylon and reverses its policy of deporting conquered peoples. He issues a decree allowing the Jews to return to Judah and rebuild their Temple, and even returns the Temple's gold and silver vessels. Around 42,000 people make the journey back, though many choose to stay in Babylon. The Bible calls Cyrus God's anointed, a rare honour for a foreign king." },
      { y: -516, p: 1, t: "Second Temple dedicated", d: "Led by the governor Zerubbabel and encouraged by the prophets Haggai and Zechariah, the returned exiles finish rebuilding the Temple. Older people who remembered Solomon's Temple weep because the new one is so much plainer. It is dedicated with great celebration in the sixth year of King Darius. This Second Temple will stand for almost 600 years, giving its name to the whole period." },
      { y: -480, c: 1, p: 3, t: "The story of Esther", d: "In the Persian capital of Shushan, the king's adviser Haman plots to kill every Jew in the empire on a single day. Queen Esther, who has kept her Jewish identity secret, risks her life by going to the king uninvited. Haman's plot is exposed and the Jews are saved. The story is read from a scroll called the Megillah every year at Purim, with noisemakers drowning out Haman's name." },
      { y: -458, c: 1, p: 2, t: "Ezra reads the Torah", d: "Ezra, a priest and scribe, leads a second group of exiles from Babylon to Jerusalem. He finds that many people no longer know the Torah. Standing on a wooden platform, he reads it aloud to the whole gathered population from dawn until noon, with helpers explaining it. Tradition credits Ezra with making the Torah the centre of Jewish life and with starting regular public Torah readings." },
      { y: -332, p: 2, t: "Alexander the Great", d: "Alexander of Macedon sweeps across the Persian Empire and takes control of Judea. Jewish legend says he bowed before the High Priest in Jerusalem and spared the city. After his early death his empire is split between his generals, and Judea passes between the Ptolemies of Egypt and the Seleucids of Syria. Greek language and culture spread through the region and deeply influence Jewish life." },
      { y: -250, c: 1, p: 3, t: "The Septuagint", d: "In Alexandria, Egypt, home to a large Greek-speaking Jewish community, the Torah is translated into Greek. Legend says 72 scholars, six from each tribe, worked separately and produced identical translations. Its name comes from the Latin for seventy. The Septuagint let Greek speakers read the Bible for the first time and later became the Old Testament of the early Christian church." },
      { y: -167, p: 2, t: "Maccabean revolt", d: "The Seleucid king Antiochus IV bans circumcision, Sabbath observance and Torah study, and puts a statue of Zeus in the Temple. In the village of Modi'in, the elderly priest Mattathias refuses to sacrifice to the Greek gods and kills an official who does. He flees to the hills with his five sons and starts a guerrilla war. His son Judah, nicknamed Maccabee, meaning \"the hammer\", leads the fighters." },
      { y: -164, p: 1, t: "Temple rededicated", d: "After three years of fighting, Judah Maccabee and his forces retake Jerusalem and cleanse the defiled Temple. They rebuild the altar and relight the great menorah. The Talmud tells that they found only enough pure oil for one day, but it burned for eight. The festival of Hanukkah, meaning \"dedication\", celebrates this with eight nights of candles. The Maccabees' family, the Hasmoneans, go on to rule an independent kingdom." },
      { y: -63, p: 2, t: "Rome takes Jerusalem", d: "Two Hasmonean brothers, Hyrcanus and Aristobulus, fight a civil war over the throne, and both ask Rome for help. The Roman general Pompey marches in and besieges the Temple Mount for three months. When it falls he walks into the Holy of Holies, which only the High Priest was allowed to enter, shocking the Jewish people. Judea loses its independence and becomes a Roman client state." },
      { y: -40, e: -37, p: 3, t: "Last Hasmonean king", d: "With help from the Parthian Empire, Antigonus II Mattathias, the last of the Maccabee family, seizes Jerusalem and becomes king and High Priest. Rome responds by naming Herod king of Judea. After a five-month siege, Herod and the Romans take Jerusalem in 37 BCE, and Antigonus is executed. His coins are the first to show the Temple menorah." },
      { y: -37, p: 2, t: "Herod the Great", d: "Herod, backed by Rome, becomes king of Judea. He is a brilliant builder but a cruel and paranoid ruler who murders his own wife and sons. His greatest project is rebuilding the Temple on a huge scale, with a vast platform held up by enormous retaining walls. The Western Wall is part of that platform. He also builds the fortress of Masada, the port of Caesarea and the Herodium." },
      { y: -30, c: 1, p: 3, t: "Hillel and Shammai", d: "Hillel, a poor scholar from Babylon, and Shammai, a strict builder from Judea, are the leading rabbis of their day. Their schools disagree on hundreds of questions of Jewish law, usually with Hillel's side being more lenient. Hillel is famous for summing up the Torah while standing on one foot: \"What is hateful to you, do not do to your neighbour. The rest is commentary.\" Jewish law mostly follows the House of Hillel." },
      { y: -22, c: 1, p: 3, t: "Caesarea built", d: "Herod builds a grand new port city on the coast and names it Caesarea in honour of the emperor Augustus. Its harbour, built with early underwater concrete, is one of the largest in the Roman world. The city has a theatre, a hippodrome and a temple to Augustus. It later becomes the capital of the Roman province and the scene of clashes that spark the Great Revolt." },
      { y: -20, c: 1, p: 2, t: "Herod rebuilds the Temple", d: "Herod begins a huge rebuilding of the Second Temple, doubling the size of the Temple Mount with massive retaining walls. Some of the stones weigh hundreds of tons. Priests are trained as builders so the holy areas are never entered by others. The Talmud says that whoever has not seen Herod's Temple has never seen a beautiful building. The Western Wall is part of his work." },
      { y: -4, p: 3, t: "Death of Herod", d: "Herod dies after a long and painful illness and is buried at Herodium, the palace-fortress he built near Bethlehem. Rome divides his kingdom among three of his sons: Archelaus gets Judea, Antipas gets the Galilee and Philip gets the north-east. Riots break out across the country. His tomb was found by archaeologist Ehud Netzer in 2007." },
      { y: 6, p: 3, t: "Judea under Roman governors", d: "Rome removes Archelaus and puts Judea under the direct rule of Roman governors. A Roman census for tax purposes sparks a revolt led by Judas of Galilee, whose followers become known as the Zealots. Governors like Pontius Pilate often insult Jewish religious feelings. Tension between Jews and Rome grows steadily for the next sixty years." },
      { y: 30, c: 1, p: 3, t: "Jesus of Nazareth", d: "Jesus, a Jewish teacher from the Galilee, preaches in the villages around the Sea of Galilee and is crucified by the Romans under Pontius Pilate. His followers at first are a small group within Judaism. Over the following decades, especially through the travels of Paul, the movement spreads among non-Jews and gradually becomes a separate religion, Christianity." },
      { y: 38, p: 3, t: "Riots in Alexandria", d: "Alexandria in Egypt has one of the largest Jewish communities in the world. Greek mobs attack it, force Jews into one quarter of the city, burn synagogues and kill many. It is sometimes called the first pogrom. The philosopher Philo of Alexandria leads a delegation to the emperor Caligula in Rome to plead for the community's rights." },
      { y: 40, p: 3, t: "Caligula's statue", d: "The emperor Caligula, who believes he is a god, orders a statue of himself to be placed inside the Temple in Jerusalem. Tens of thousands of Jews gather to protest, saying they would rather die. The Roman governor Petronius delays carrying out the order. Caligula is assassinated in January 41, and the statue is never installed." },
      { y: 41, p: 3, t: "King Agrippa I", d: "Herod's grandson Agrippa, a friend of the new emperor Claudius, is made king of all Judea. He is popular with the Jewish people and respectful of the Temple and the Torah. He begins a new wall around Jerusalem, but Rome orders him to stop. His sudden death in 44 CE ends the last period of Jewish self-rule, and Roman governors return." },
      { y: 66, e: 73, p: 2, t: "Great Revolt", d: "Years of harsh Roman rule, heavy taxes and insults to Jewish religion explode into open revolt. Rebels drive the Romans out of Jerusalem, but Rome sends huge armies under Vespasian and his son Titus. Galilee falls, then Jerusalem in 70 CE. The last rebels hold out on the mountain fortress of Masada until 73 CE, when, according to the historian Josephus, they chose death over slavery." },
      { y: 67, p: 3, t: "Galilee falls", d: "The Roman general Vespasian marches into the Galilee with three legions. The fortified towns of Yodfat and Gamla fall after bloody sieges. The Jewish commander at Yodfat, Joseph ben Matityahu, surrenders and goes over to the Romans. As Flavius Josephus, he later writes the history of the war, our main source for the period." },
      { y: 68, c: 1, p: 3, t: "Qumran destroyed", d: "As Roman forces advance down the Jordan Valley, the settlement at Qumran by the Dead Sea is destroyed. Many scholars believe its community, likely the Essenes, hid their library of scrolls in nearby caves before the Romans arrived. The scrolls lay there for nearly 1,900 years until shepherds found them in 1947." },
      { y: 70, p: 1, t: "Second Temple destroyed", d: "After a five-month siege, Roman legions under Titus break into Jerusalem and set the Temple on fire on the 9th of Av, the same date as the First Temple's destruction. The city is levelled, and huge numbers are killed or sold as slaves. The Arch of Titus in Rome still shows soldiers carrying away the Temple menorah. Judaism survives by moving its centre from the Temple to prayer, study and the synagogue." },
      { y: 70, c: 1, p: 2, t: "Yohanan ben Zakkai and Yavneh", d: "During the siege of Jerusalem, the sage Rabban Yohanan ben Zakkai is smuggled out of the city in a coffin. Tradition says he meets Vespasian and asks for one thing: \"Give me Yavneh and its sages.\" In the small town of Yavneh he sets up an academy that becomes the new centre of Jewish life. It is the beginning of Judaism without a Temple." },
      { y: 73, p: 2, t: "Fall of Masada", d: "Nearly 1,000 Jewish rebels and their families hold out on the cliff-top fortress of Masada for three years after Jerusalem falls. The Roman Tenth Legion builds a huge siege ramp up the western side. According to Josephus, when the walls are breached the defenders choose to die by their own hands rather than be enslaved. The ramp is still there today." },
      { y: 132, e: 135, p: 1, t: "Bar Kokhba revolt", d: "When Emperor Hadrian plans to rebuild Jerusalem as a Roman city with a temple to Jupiter, the Jews rise up again. Their leader Simon bar Kosiba, called Bar Kokhba, \"son of a star\", sets up an independent state for three years and mints his own coins. Rome crushes the revolt brutally, destroying hundreds of villages. Jews are banned from Jerusalem, and the province is renamed Syria Palaestina." },
      { y: 200, c: 1, p: 1, t: "The Mishnah", d: "For centuries the Oral Law, the explanations of how to live by the Torah, was passed down by memory. With so many scholars killed in the wars against Rome, Rabbi Judah the Prince decides to write it down. He organises it into six orders covering farming, festivals, marriage, civil law, the Temple and purity. The Mishnah becomes the foundation of all later Jewish law." },
      { y: 400, c: 1, p: 3, t: "Jerusalem Talmud", d: "In the academies of Tiberias, Sepphoris and Caesarea in the Galilee, rabbis spend generations discussing and expanding on the Mishnah. Their debates are collected as the Jerusalem Talmud, though it was actually written in the Galilee. It is shorter and less polished than the Babylonian Talmud, likely because Roman persecution cut the work short. It remains especially important for laws about farming in the Land of Israel." },
      { y: 500, c: 1, p: 1, t: "Babylonian Talmud", d: "The great academies of Sura and Pumbedita in Babylonia, in today's Iraq, produce the Babylonian Talmud over about three centuries. It records the debates of hundreds of rabbis on the Mishnah, mixing law with stories, medicine, ethics and folklore. It runs to over 2.5 million words. To this day it is the central text studied in yeshivas, and finishing it all takes seven and a half years at one page a day." },
      { y: 638, p: 2, t: "Jews return to Jerusalem", d: "For five centuries under Roman and then Byzantine Christian rule, Jews were largely banned from living in Jerusalem. When the Arab Caliph Umar captures the city, he allows Jews to return and settle there. A small Jewish community grows near the Temple Mount. Over the following centuries Jerusalem changes hands many times, but a Jewish presence continues almost without a break." },
      { y: 930, c: 1, p: 3, t: "Aleppo Codex", d: "In Tiberias, the scribe Shlomo ben Buya'a writes the text and the scholar Aaron ben Asher adds the vowels and cantillation marks. The result is the most accurate manuscript of the Hebrew Bible ever made, later used by Maimonides as his standard. It was kept for centuries in the Great Synagogue of Aleppo, Syria. In riots in 1947 about a third of it went missing, and the rest is now in the Israel Museum." },
      { y: 950, c: 1, p: 2, t: "Golden Age in Spain", d: "Under Muslim rule in Spain, called al-Andalus, Jews rise to high positions as doctors, advisers and even viziers. Poets like Judah Halevi and Solomon ibn Gabirol write Hebrew poetry still sung in synagogues today. Jewish thinkers translate Greek and Arabic science and philosophy. The golden age fades in the 12th century as stricter Muslim and then Christian rulers take over." },
      { y: 1040, p: 2, t: "Rashi is born", d: "Rabbi Shlomo Yitzchaki, known as Rashi, is born in Troyes, France, where he later earns his living from vineyards. He writes a clear, word-by-word commentary on almost the entire Bible and Talmud. His explanations are so useful that nearly every printed Talmud since has his commentary on the inside edge of every page. Children starting to study the Torah still learn it with Rashi." },
      { y: 1096, p: 2, t: "First Crusade", d: "As Christian armies march east to capture Jerusalem, some crusaders decide to attack the \"enemies of Christ\" at home first. In the spring of 1096 they massacre the Jewish communities of Speyer, Worms, Mainz and Cologne in the Rhineland. Thousands are killed, and many take their own lives rather than be forcibly baptised. The massacres are remembered in mournful prayers still recited today." },
      { y: 1138, p: 2, t: "Maimonides is born", d: "Rabbi Moses ben Maimon, known as Maimonides or the Rambam, is born in Córdoba, Spain. His family flees persecution and he settles in Egypt, where he becomes doctor to the sultan's court. He writes the Mishneh Torah, a complete code of Jewish law, and the Guide for the Perplexed, which reconciles faith with Aristotle's philosophy. People said: \"From Moses to Moses, there was none like Moses.\"" },
      { y: 1144, p: 3, t: "First blood libel", d: "When a boy named William is found dead in Norwich, England, local Jews are falsely accused of killing him in a mock crucifixion. A monk writes a book spreading the story, and William is treated as a saint. This lie, that Jews murder Christian children for religious rituals, spreads across Europe. Over the following centuries it leads to countless trials, massacres and expulsions." },
      { y: 1215, p: 3, t: "Jewish badge", d: "The Fourth Lateran Council, a great gathering of the Catholic Church, orders Jews and Muslims to wear clothing that sets them apart from Christians. In different countries this becomes a yellow or red badge, a patch shaped like the stone tablets, or a pointed hat. The marking makes Jews easy targets for abuse. The Nazis later revived the idea with the yellow star." },
      { y: 1290, p: 2, t: "Expelled from England", d: "After years of crushing taxes, blood libels and violence, King Edward I issues an edict expelling every Jew from England. Around 3,000 people must leave by All Saints' Day, and their homes and debts are seized by the crown. England becomes the first European country to expel all its Jews. They are only allowed to return in 1656, under Oliver Cromwell." },
      { y: 1306, p: 3, t: "Expelled from France", d: "King Philip IV, short of money for his wars, has every Jew in France arrested on a single day. Around 100,000 people are expelled with only the clothes they wear, and the king takes their property and the debts owed to them. Some are later allowed back, but France expels its Jews again in 1394. Many settle in Germany, Provence and Spain." },
      { y: 1348, p: 2, t: "Black Death massacres", d: "As the plague kills around a third of Europe's people, rumours spread that Jews are poisoning the wells. Under torture, some Jews \"confess\", and mobs attack communities across Switzerland, France and Germany. In Strasbourg about 2,000 Jews are burned alive on a single day. Hundreds of communities are wiped out, and many survivors flee east to Poland, which welcomes them." },
      { y: 1391, p: 3, t: "Riots in Spain", d: "Stirred up by the preacher Ferrand Martínez, mobs attack the Jewish quarter of Seville in June 1391. The violence spreads to Córdoba, Toledo, Valencia, Barcelona and dozens of other cities. Thousands are killed and many thousands more are baptised to save their lives. These forced converts and their descendants, called conversos, later become the main targets of the Spanish Inquisition." },
      { y: 1475, p: 3, t: "First Hebrew printed book", d: "Just twenty years after Gutenberg, Jewish printers in Italy begin printing in Hebrew. In February 1475, Abraham ben Garton prints Rashi's commentary on the Torah in Reggio di Calabria, the first dated Hebrew printed book. Soon after, the Soncino family produces the first complete printed Hebrew Bible in 1488. Printing makes Jewish books far cheaper and helps spread learning across the diaspora." },
      { y: 1492, p: 1, t: "Expelled from Spain", d: "Months after conquering Granada, King Ferdinand and Queen Isabella order every Jew to convert or leave Spain within four months. Up to 200,000 people leave, ending over a thousand years of Jewish life in Spain. Many go to Portugal, North Africa, Italy and the Ottoman Empire, where Sultan Bayezid II welcomes them. Their descendants are known as Sephardic Jews, from Sepharad, Hebrew for Spain." },
      { y: 1497, p: 3, t: "Forced conversion in Portugal", d: "Many Jews expelled from Spain had fled to neighbouring Portugal. To marry the Spanish princess, King Manuel I agrees to rid his country of Jews, but he doesn't want to lose them. Instead of letting them leave, he has them forcibly baptised, including children taken from their parents. Many keep practising Judaism in secret for generations, and in 1506 a mob in Lisbon kills hundreds of these New Christians." },
      { y: 1516, p: 2, t: "First ghetto, Venice", d: "The Venetian government orders all the city's Jews to live on a small island in the Cannaregio district, an area once used as a copper foundry, or getto. Gates are locked at night and Christian guards, paid for by the Jews, watch over them. The word ghetto spreads across Europe for any walled Jewish quarter. Because space was so tight, the buildings are among the tallest in old Venice." },
      { y: 1565, p: 2, t: "Shulchan Aruch printed", d: "Rabbi Joseph Karo, a Spanish exile living in Safed, publishes the Shulchan Aruch, meaning \"set table\". It lays out Jewish law clearly on everything from prayer to business. Rabbi Moses Isserles of Kraków adds notes for Ashkenazi customs, which he calls the \"tablecloth\". Together they become the standard guide to Jewish law, still used by observant Jews around the world." },
      { y: 1570, p: 3, t: "Luria in Safed", d: "Rabbi Isaac Luria, known as the Ari, \"the lion\", arrives in the hill town of Safed in the Galilee, then a thriving centre of Jewish learning. In less than three years before his death, he teaches a new and influential system of Kabbalah, Jewish mysticism. His ideas about repairing a broken world, tikkun olam, spread across the Jewish world. The synagogues named after him still stand in Safed." },
      { y: 1648, p: 2, t: "Khmelnytsky massacres", d: "Bohdan Khmelnytsky leads a Cossack and peasant uprising against Polish rule in Ukraine. Jews, many of whom worked as estate managers and tax collectors for Polish nobles, are slaughtered alongside Poles. Tens of thousands are killed and hundreds of communities destroyed. Jewish chroniclers called it the worst catastrophe since the Temple's destruction, and it shook Polish Jewry for generations." },
      { y: 1654, p: 2, t: "First Jews in America", d: "When Portugal reconquers Dutch Brazil, its Jews flee. A ship carrying 23 Jewish refugees, men, women and children, arrives in the Dutch colony of New Amsterdam. Governor Peter Stuyvesant tries to expel them, but the Dutch West India Company, which had Jewish shareholders, overrules him. They found Congregation Shearith Israel, still active in New York today." },
      { y: 1665, p: 3, t: "Shabbetai Tzvi", d: "Shabbetai Tzvi, a charismatic rabbi from Smyrna, declares himself the Messiah, backed by his prophet Nathan of Gaza. Excitement sweeps the Jewish world, from Amsterdam to Yemen, and many sell their homes to prepare for the return to Zion. In 1666 the Ottoman sultan has him arrested and gives him a choice: convert to Islam or die. He converts, leaving his followers devastated." },
      { y: 1740, c: 1, p: 2, t: "Hasidism begins", d: "In the villages of Ukraine and Poland, Rabbi Israel ben Eliezer, known as the Baal Shem Tov, teaches that God can be served through joy, song and simple heartfelt prayer, not only scholarship. His followers, called Hasidim, gather around spiritual leaders known as rebbes. The movement spreads rapidly and faces fierce opposition at first. Today Hasidic communities number hundreds of thousands worldwide." },
      { y: 1783, p: 3, t: "The Haskalah", d: "Moses Mendelssohn, a self-taught philosopher in Berlin, argues that Jews can be fully part of European society while staying true to Judaism. He translates the Torah into German and writes \"Jerusalem\", calling for freedom of religion. His ideas launch the Haskalah, the Jewish Enlightenment, which encourages secular education, modern languages and science. It reshapes Jewish life across Europe." },
      { y: 1791, p: 2, t: "Citizenship in France", d: "In the spirit of the French Revolution's Declaration of the Rights of Man, the National Assembly grants Jews full and equal citizenship. France is the first country in Europe to do so. A deputy famously says the Jews should be given everything as individuals and nothing as a nation. Napoleon's armies later spread Jewish emancipation across much of Europe." },
      { y: 1840, p: 3, t: "Damascus affair", d: "When a Catholic monk disappears in Damascus, local Jews are accused of murdering him to use his blood. Several are tortured, two die, and Jewish children are taken hostage. Moses Montefiore from Britain and Adolphe Crémieux from France travel to the Middle East and win the prisoners' release. It is the first time Jews around the world organise together to defend Jews in another country." },
      { y: 1860, p: 3, t: "Outside the Old City walls", d: "Jerusalem's Old City is overcrowded, poor and unhealthy. With money left by the American philanthropist Judah Touro, Sir Moses Montefiore builds Mishkenot Sha'ananim, a row of homes just outside the walls. At first residents are so afraid of bandits that they return inside the walls at night. Its success leads to new neighbourhoods and the growth of modern West Jerusalem." },
      { y: 1881, p: 2, t: "Pogroms in Russia", d: "After Tsar Alexander II is assassinated, rumours blame the Jews. Waves of mob violence, called pogroms, sweep through hundreds of towns in the Russian Empire, often with police doing nothing. Harsh new laws then restrict where Jews can live and work. Over the next 40 years more than two million Jews leave Eastern Europe, most for the United States." },
      { y: 1882, p: 3, t: "First Aliyah", d: "Inspired by the pogroms and early Zionist groups like the Bilu and Hovevei Zion, the first modern wave of Jewish immigrants arrives in the Land of Israel. About 25,000 to 35,000 people come over two decades. They found farming villages like Rishon LeZion, Zikhron Ya'akov and Rosh Pinna, many supported by Baron Edmond de Rothschild. Their struggles with malaria and poverty were severe." },
      { y: 1894, p: 2, t: "Dreyfus affair", d: "Alfred Dreyfus, a Jewish captain in the French army, is falsely convicted of selling secrets to Germany and sent to Devil's Island. At his public degradation, crowds shout \"Death to the Jews!\" The writer Émile Zola publishes \"J'accuse\", exposing the cover-up, and France is torn apart. Dreyfus is finally cleared in 1906. Watching the affair convinced journalist Theodor Herzl that Jews needed a state of their own." },
      { y: 1897, p: 1, t: "First Zionist Congress", d: "Theodor Herzl brings about 200 delegates from 17 countries to a concert hall in Basel, Switzerland. They found the Zionist Organisation and adopt the Basel Programme, which aims for a publicly recognised home for the Jewish people in the Land of Israel. Herzl writes in his diary: \"At Basel I founded the Jewish State.\" He predicts it will exist within fifty years. It took fifty-one." },
      { y: 1909, p: 3, t: "Tel Aviv founded", d: "Sixty-six Jewish families from overcrowded Jaffa buy sand dunes to the north to build a garden suburb called Ahuzat Bayit. On 11 April 1909 they gather on the beach and divide the plots by lottery, using seashells with names and numbers. The neighbourhood is renamed Tel Aviv, \"hill of spring\", after Herzl's novel. It becomes the first modern Hebrew city and now has hundreds of thousands of residents." },
      { y: 1917, p: 2, t: "Balfour Declaration", d: "In a letter to Lord Rothschild, British Foreign Secretary Arthur Balfour states that the government \"view with favour the establishment in Palestine of a national home for the Jewish people\". It also promises to protect the rights of non-Jewish communities. Britain conquers Palestine from the Ottomans weeks later. The declaration becomes part of Britain's League of Nations mandate to govern the land." },
      { y: 1933, p: 2, t: "Nazis take power", d: "Adolf Hitler is appointed Chancellor of Germany on 30 January 1933. Within weeks the Nazis open the first concentration camp at Dachau, and on 1 April they organise a national boycott of Jewish shops, with storm troopers posted outside. Jews are soon pushed out of government jobs, universities and the professions. The 1935 Nuremberg Laws strip Jews of German citizenship and ban marriage with non-Jews." },
      { y: 1938, p: 3, t: "Kristallnacht", d: "On the night of 9 to 10 November 1938, the Nazis unleash attacks on Jews across Germany and Austria. Over 1,400 synagogues are burned or damaged, thousands of Jewish shops are smashed, and around 91 Jews are killed. The name means \"night of broken glass\". About 30,000 Jewish men are sent to concentration camps, and the Jewish community is then forced to pay for the damage." },
      { y: 1941, e: 1945, p: 1, t: "The Holocaust", d: "Nazi Germany and its collaborators set out to murder every Jew in Europe. Jews are forced into ghettos, shot in mass killings across Eastern Europe, and deported in cattle cars to death camps like Auschwitz, Treblinka and Sobibor. By 1945, six million Jews have been murdered, including one and a half million children, about two thirds of Europe's Jews. Countless communities are wiped out forever." },
      { y: 1943, p: 3, t: "Warsaw Ghetto Uprising", d: "When the Germans enter the Warsaw Ghetto to deport its last remaining Jews to Treblinka, young fighters of the Jewish Combat Organisation open fire. Armed with a few pistols, rifles and homemade bombs, they hold off the German army for almost a month. The Germans burn the ghetto block by block. It is the largest Jewish revolt of the war and a lasting symbol of resistance." },
      { y: 1947, p: 3, t: "Dead Sea Scrolls found", d: "Bedouin shepherds searching for a lost goat find clay jars of ancient scrolls in a cave at Qumran, near the Dead Sea. Over the next ten years, fragments of about 900 manuscripts are found in eleven caves. Some are over 2,000 years old, a thousand years older than any Hebrew Bible known before. They include every book of the Hebrew Bible except Esther, and a complete scroll of Isaiah." },
      { y: 1948, p: 1, t: "State of Israel", d: "On 14 May 1948, the day the British mandate ends, David Ben-Gurion reads Israel's Declaration of Independence in the Tel Aviv Museum. It promises equal rights for all citizens and opens the country to Jewish immigration. The next day, the armies of Egypt, Jordan, Syria, Lebanon and Iraq invade. Israel wins its War of Independence at a cost of about 6,000 lives, one percent of its Jewish population." },
      { y: 1949, e: 1950, p: 3, t: "Operation Magic Carpet", d: "Almost the entire Jewish community of Yemen, around 49,000 people, is flown to Israel on about 380 flights by American and British planes. Many had walked for weeks across the desert to reach the British camp at Aden. Most had never seen an aeroplane, and some recalled the verse from Isaiah about being carried \"on eagles' wings\". An ancient community that had lived in Yemen for over 2,000 years moved almost entirely to Israel." },
      { y: 1956, p: 3, t: "Suez Crisis", d: "After Egypt's President Nasser nationalises the Suez Canal and blocks Israeli shipping, Israel secretly coordinates with Britain and France. Israeli forces sweep across the Sinai Peninsula in under a week. Under heavy pressure from both the United States and the Soviet Union, all three countries withdraw. Israel gains UN peacekeepers on the border and freedom of shipping through the Straits of Tiran." },
      { y: 1961, p: 3, t: "Eichmann trial", d: "Adolf Eichmann, who organised the deportation of millions of Jews to the death camps, is captured in Argentina by Israeli agents and brought to Jerusalem. His televised trial gives survivors a chance to tell their stories to the world, many for the first time. He claims he was only following orders. Eichmann is convicted and hanged in 1962, the only execution ever carried out by the State of Israel." },
      { y: 1967, p: 1, t: "Six-Day War", d: "With Egyptian, Syrian and Jordanian armies massing on its borders, Israel launches a pre-emptive strike. In six days it captures the Sinai and Gaza from Egypt, the West Bank and East Jerusalem from Jordan, and the Golan Heights from Syria. Israeli paratroopers reach the Western Wall, and Jews can pray there for the first time in 19 years. The war reshapes the Middle East." },
      { y: 1972, p: 2, t: "Munich massacre", d: "During the Olympic Games in Munich, eight Palestinian terrorists from the Black September group break into the Israeli team's apartment. They kill two athletes and take nine others hostage. A failed German rescue attempt at an airfield ends with all nine hostages killed, along with a German police officer. Israel later hunts down those it holds responsible in a years-long covert operation." },
      { y: 1973, p: 2, t: "Yom Kippur War", d: "On Yom Kippur, the holiest day of the Jewish year, Egypt and Syria launch a surprise attack. Egyptian forces cross the Suez Canal and Syrian tanks pour into the Golan Heights. After heavy losses in the first days, Israel pushes back on both fronts, crossing the canal and advancing towards Damascus. Over 2,600 Israeli soldiers are killed, and the shock leads to major changes in Israeli politics." },
      { y: 1976, p: 3, t: "Entebbe raid", d: "Terrorists hijack an Air France flight from Tel Aviv and fly it to Entebbe, Uganda, where dictator Idi Amin protects them. Non-Israeli passengers are released, but about 100 Israeli and Jewish hostages are held. Israeli commandos fly over 4,000 kilometres and free them in a 90-minute night raid. Three hostages and the commander, Yoni Netanyahu, are killed." },
      { y: 1977, p: 3, t: "Sadat visits Jerusalem", d: "Egyptian President Anwar Sadat becomes the first Arab leader to visit Israel. He flies to Jerusalem and speaks to the Knesset, Israel's parliament, calling for peace. Israelis watch in amazement as the leader of their greatest enemy steps off the plane. The visit opens the way to talks with Prime Minister Menachem Begin, hosted by US President Jimmy Carter." },
      { y: 1979, p: 3, t: "Peace with Egypt", d: "Following the Camp David talks, Israel and Egypt sign a peace treaty on the White House lawn. Israel agrees to return the entire Sinai Peninsula, and Egypt becomes the first Arab country to recognise Israel. Sadat and Begin share the Nobel Peace Prize. The peace holds to this day, though Sadat is assassinated by Islamist extremists in 1981." },
      { y: 1981, p: 3, t: "Osirak strike", d: "Israel believes Iraq's Osirak nuclear reactor, being built with French help near Baghdad, could give Saddam Hussein a nuclear bomb. Eight Israeli F-16 jets fly about 1,600 kilometres across Saudi and Jordanian airspace and destroy it in under two minutes. The world condemns the strike at the time. Many later see it as having prevented Iraq from getting nuclear weapons." },
      { y: 1982, p: 3, t: "First Lebanon War", d: "After repeated attacks on northern Israel from PLO bases in Lebanon, Israel invades. Its forces reach Beirut and besiege the city until the PLO leadership leaves for Tunisia. The massacre of Palestinians at Sabra and Shatila by a Christian militia causes outrage in Israel, and 400,000 people protest in Tel Aviv. Israel stays in a security zone in southern Lebanon until 2000." },
      { y: 1984, e: 1985, p: 3, t: "Operation Moses", d: "Thousands of Ethiopian Jews, known as Beta Israel, walk for weeks to refugee camps in Sudan, and many die on the way. Over seven weeks, Israel secretly airlifts about 8,000 of them from Sudan to Israel. The operation ends suddenly when news of it leaks to the press. Beta Israel had lived in Ethiopia for many centuries, cut off from the rest of the Jewish world." },
      { y: 1987, p: 3, t: "First Intifada", d: "After a traffic accident in Gaza kills four Palestinians, protests erupt and spread across Gaza and the West Bank. The uprising, called the intifada, meaning \"shaking off\", includes strikes, boycotts, stone-throwing and later deadlier attacks. It lasts until 1993. During this time the Islamist group Hamas is founded, and the uprising pushes both sides towards negotiations." },
      { y: 1989, e: 1991, p: 2, t: "Soviet aliyah", d: "For decades Soviet Jews were mostly forbidden to leave, and those who applied, known as refuseniks, often lost their jobs or went to prison. As the Soviet Union opens up and then collapses, the gates finally open. Around a million people move to Israel during the 1990s, growing its population by about 20 percent. They bring huge numbers of engineers, doctors, scientists and musicians." },
      { y: 1991, p: 3, t: "Operation Solomon", d: "As rebels close in on Ethiopia's capital, Addis Ababa, Israel races to rescue the remaining Beta Israel community. In 36 hours, 35 Israeli aircraft fly over 14,000 Ethiopian Jews to Israel. One El Al jumbo jet carries over 1,000 passengers, a world record, and several babies are born during the flights. Seats are removed to fit as many people as possible." },
      { y: 1993, p: 2, t: "Oslo Accords", d: "After secret talks in Norway, Israel and the Palestine Liberation Organization recognise each other. On the White House lawn, Prime Minister Yitzhak Rabin and PLO leader Yasser Arafat shake hands as President Bill Clinton looks on. The accords create the Palestinian Authority with limited self-rule in parts of the West Bank and Gaza. Rabin, Arafat and Shimon Peres share the Nobel Peace Prize." },
      { y: 1994, p: 3, t: "Peace with Jordan", d: "Israel and Jordan sign a peace treaty at a border crossing in the Arava desert, with Prime Minister Rabin, King Hussein and President Clinton present. Jordan becomes the second Arab country to make peace with Israel. The treaty settles the border and water sharing. King Hussein and Rabin had built a warm personal friendship, and the king spoke movingly at Rabin's funeral a year later." },
      { y: 1995, p: 2, t: "Rabin assassinated", d: "On 4 November 1995, after a huge peace rally in Tel Aviv, Prime Minister Yitzhak Rabin is shot dead by Yigal Amir, a Jewish extremist opposed to the Oslo Accords. The country is in shock. Leaders from around the world, including Arab heads of state, attend his funeral in Jerusalem. The square where he was killed is renamed Rabin Square." },
      { y: 2000, p: 2, t: "Second Intifada", d: "After peace talks at Camp David collapse in 2000, a second, far more violent uprising begins. Suicide bombers attack buses, cafés, hotels and nightclubs inside Israel. Over 1,000 Israelis and around 3,000 Palestinians are killed by 2005. Israel launches major military operations in the West Bank and begins building the security barrier." },
      { y: 2005, p: 2, t: "Gaza disengagement", d: "Prime Minister Ariel Sharon, once the champion of settlements, pulls Israel out of Gaza completely. About 8,000 Israeli settlers are removed from 21 communities, some dragged out by soldiers, and their homes are demolished. Four small settlements in the northern West Bank are also evacuated. Two years later Hamas seizes control of Gaza from the Palestinian Authority." },
      { y: 2005, p: 3, t: "Holocaust Remembrance Day", d: "Sixty years after the liberation of Auschwitz, the United Nations General Assembly names 27 January as International Holocaust Remembrance Day. The resolution rejects any denial of the Holocaust and calls on countries to teach future generations about it. Israel also keeps its own Holocaust Remembrance Day, Yom HaShoah, in spring, when sirens sound and the whole country stands still for two minutes." },
      { y: 2006, p: 3, t: "Second Lebanon War", d: "Hezbollah fighters cross into Israel, kill three soldiers and kidnap two more. Israel responds with air strikes and a ground invasion of southern Lebanon. Hezbollah fires about 4,000 rockets into northern Israel, sending hundreds of thousands of people into shelters or away from their homes. The 34-day war ends with a UN ceasefire, and the bodies of the two kidnapped soldiers are returned in 2008." },
      { y: 2011, p: 3, t: "Gilad Shalit freed", d: "In 2006, Hamas fighters tunnel into Israel and capture 19-year-old soldier Gilad Shalit. He is held in Gaza for over five years with no visits from the Red Cross, while his family campaigns tirelessly for his release. In October 2011 he is exchanged for 1,027 Palestinian prisoners, many convicted of deadly attacks. One of those released, Yahya Sinwar, later plans the 7 October attack." },
      { y: 2014, p: 3, t: "Gaza war", d: "After three Israeli teenagers are kidnapped and murdered in the West Bank, tensions explode. Hamas fires thousands of rockets at Israeli cities, many stopped by the new Iron Dome defence system. Israel launches air strikes and then sends ground troops into Gaza to destroy attack tunnels. The 50-day war kills over 2,000 Palestinians and 73 Israelis." },
      { y: 2018, p: 2, t: "Pittsburgh synagogue attack", d: "During Shabbat morning services, a gunman shouting antisemitic slurs enters the Tree of Life synagogue in the Squirrel Hill neighbourhood of Pittsburgh. He murders 11 worshippers, the oldest aged 97. It is the deadliest antisemitic attack in American history. The attacker was later sentenced to death, and the synagogue is being rebuilt with a memorial." },
      { y: 2018, p: 3, t: "US embassy in Jerusalem", d: "President Donald Trump recognises Jerusalem as Israel's capital, and on 14 May 2018, the 70th anniversary of Israel's independence, the US embassy moves there from Tel Aviv. Most countries had kept their embassies in Tel Aviv because of the city's disputed status. A handful of other countries follow the United States. The move is welcomed in Israel and condemned by Palestinian leaders." },
      { y: 2020, p: 2, t: "Abraham Accords", d: "At the White House, Israel signs agreements to normalise relations with the United Arab Emirates and Bahrain, the first Arab countries to do so since Jordan in 1994. Morocco and Sudan follow within months. Direct flights, trade and tourism begin almost immediately. The accords are named after Abraham, the shared ancestor of Jews and Arabs." },
      { y: 2023, p: 1, t: "7 October attack", d: "On the Simchat Torah holiday, Hamas launches a surprise attack from Gaza by land, sea and air. About 3,000 terrorists break through the border and attack kibbutzim, towns, army bases and the Nova music festival. Around 1,200 people are murdered, most of them civilians, and 251 are taken hostage into Gaza. It is the deadliest day for Jews since the Holocaust." },
      { y: 2023, e: 2025, p: 3, t: "War in Gaza", d: "Israel declares war on Hamas, calls up 360,000 reservists and launches a long air and ground campaign in Gaza. Hezbollah fires on northern Israel from Lebanon, forcing tens of thousands to leave their homes, and Israel later strikes Hezbollah hard. The war causes enormous destruction and loss of life in Gaza. Hostages are freed in stages through ceasefire deals and rescue operations." },
      { y: 2025, p: 3, t: "Twelve-Day War with Iran", d: "In June 2025, Israel launches a large air campaign against Iran's nuclear programme, military leaders and missile sites. Iran fires hundreds of ballistic missiles and drones at Israel, and some get through, causing deaths and damage in cities like Tel Aviv, Bat Yam and Beersheba. The United States joins in and strikes Iran's main nuclear sites. A ceasefire ends the fighting after twelve days." },
      { y: 2025, p: 2, t: "Hostages come home", d: "Under a US-brokered ceasefire and hostage deal, the last 20 living hostages held in Gaza are released on 13 October 2025, after more than two years in captivity. Huge crowds gather in Tel Aviv's Hostages Square to watch them come home. In return, Israel releases nearly 2,000 Palestinian prisoners and detainees. The return of the remaining bodies of hostages who died continues afterwards." }
    ];
