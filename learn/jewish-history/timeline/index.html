      { y: 1753, p: 3, t: "Jew Bill in Britain", d: "The British Parliament passes the Jewish Naturalisation Act, letting foreign-born Jews become British subjects. It sparks a storm of antisemitic pamphlets, cartoons and protests, with crowds shouting \"No Jews, no wooden shoes!\" The government, facing an election, repeals the law within months. Full equal rights for British Jews only come in 1858." },
      { y: 1759, p: 3, t: "The Frankists", d: "Jacob Frank, who claims to be the heir of Shabbetai Tzvi, leads a sect that rejects the Talmud and mixes Kabbalah with strange rituals. After rabbis excommunicate them, the Frankists side with the Catholic Church against the Jews in a public disputation in Lviv. Around 500 of them are baptised, with Polish nobles as godparents." },
      { y: 1763, p: 3, t: "Touro Synagogue", d: "Jews in Newport, Rhode Island, dedicate a synagogue designed by architect Peter Harrison. It is now the oldest surviving synagogue in the United States. In 1790, George Washington writes to its congregation that the US government \"gives to bigotry no sanction, to persecution no assistance\", a landmark promise of religious freedom." },
      { y: 1772, p: 3, t: "Ban on the Hasidim", d: "Led by the Vilna Gaon, the rabbis of Vilna issue a herem, a ban of excommunication, against the growing Hasidic movement. They accuse the Hasidim of neglecting Torah study, changing the prayer book and praying at the wrong times. The opponents, called Mitnagdim, and the Hasidim fight bitterly for decades before uniting against the threat of modernity." },
      { y: 1777, p: 3, t: "Hasidic aliyah", d: "About 300 Hasidim led by Rabbi Menachem Mendel of Vitebsk travel from Eastern Europe to the Land of Israel. They settle first in Safed and then in Tiberias. Their communities are supported by money collected back home, called halukah. They strengthen the small Jewish population in the Galilee." },
      { y: 1782, p: 3, t: "Edict of Tolerance", d: "Emperor Joseph II of Austria issues an Edict of Tolerance for the Jews of Vienna and Lower Austria. They may now send their children to state schools, learn trades, attend university and open factories, but must use German instead of Yiddish and Hebrew in business. It is a big step towards equal rights, though Jews are still limited in many ways." },
      { y: 1783, p: 3, t: "The Haskalah", d: "Moses Mendelssohn, a self-taught philosopher in Berlin, argues that Jews can be fully part of European society while staying true to Judaism. He translates the Torah into German and writes \"Jerusalem\", calling for freedom of religion. His ideas launch the Haskalah, the Jewish Enlightenment, which encourages secular education, modern languages and science. It reshapes Jewish life across Europe." },
      { y: 1791, p: 2, t: "Citizenship in France", d: "In the spirit of the French Revolution's Declaration of the Rights of Man, the National Assembly grants Jews full and equal citizenship. France is the first country in Europe to do so. A deputy famously says the Jews should be given everything as individuals and nothing as a nation. Napoleon's armies later spread Jewish emancipation across much of Europe." },
      { y: 1791, p: 3, t: "Pale of Settlement", d: "After taking over large parts of Poland, Russia's Empress Catherine the Great restricts Jews to living in the western edge of the empire, called the Pale of Settlement. Jews are banned from Moscow, St Petersburg and most of Russia proper. At its height around five million Jews live in the Pale, in towns and shtetls across today's Ukraine, Belarus, Lithuania and Poland." },
      { y: 1797, p: 3, t: "The Vilna Gaon", d: "Rabbi Elijah of Vilna, known as the Vilna Gaon, dies in Vilnius. A genius of Torah study who held no official post, he spent his life learning in seclusion and wrote commentaries on almost every Jewish text. He led the fierce opposition to Hasidism. His students found the great Lithuanian yeshivas, and some of them settle in the Land of Israel." },
      { y: 1807, p: 3, t: "Napoleon's Sanhedrin", d: "Napoleon summons 71 rabbis and community leaders to Paris as a Grand Sanhedrin, named after the ancient Jewish high court. He asks them whether Jews see France as their homeland and Frenchmen as brothers. They answer yes, and confirm that Jews must obey the laws of the state. Napoleon then organises French Jewry into official regional councils." },
      { y: 1810, p: 3, t: "Reform Judaism begins", d: "In Seesen, Germany, the banker Israel Jacobson opens a synagogue with an organ, a choir and prayers in German. Eight years later the Hamburg Temple follows. The Reform movement aims to modernise Judaism so Jews can fully join European society. In response, traditional Jews organise as Orthodox, and later a middle path, Conservative Judaism, emerges." },
      { y: 1827, p: 3, t: "Cantonist decree", d: "Tsar Nicholas I orders Jewish communities to supply boys for the Russian army, where they must serve for 25 years. Children as young as eight are snatched by community kidnappers, called khappers, and sent to military schools far from home, where many are pressured to convert. The decree tears communities apart. It is abolished in 1856." },
      { y: 1837, p: 3, t: "Galilee earthquake", d: "A massive earthquake hits the Galilee on 1 January 1837. In Safed, then the largest Jewish community in the Land of Israel, houses built on the steep hillside collapse onto each other, and around 2,000 Jews are killed. Tiberias is also badly damaged. Many survivors move to Jerusalem, which becomes the main centre of Jewish life." },
      { y: 1840, p: 3, t: "Damascus affair", d: "When a Catholic monk disappears in Damascus, local Jews are accused of murdering him to use his blood. Several are tortured, two die, and Jewish children are taken hostage. Moses Montefiore from Britain and Adolphe Crémieux from France travel to the Middle East and win the prisoners' release. It is the first time Jews around the world organise together to defend Jews in another country." },
      { y: 1848, p: 3, t: "Revolutions of 1848", d: "Revolutions sweep across Europe demanding democracy and national rights. Jews take part on the barricades in Vienna and Berlin, and several are elected to the new parliaments. The Frankfurt Parliament votes for Jewish equality, but most revolutions are crushed. The failure leads many German Jews to emigrate to the United States." },
      { y: 1853, p: 3, t: "First Hebrew novel", d: "Abraham Mapu, a teacher in Kovno, Lithuania, publishes Ahavat Zion, \"The Love of Zion\", the first modern novel in Hebrew. Set in the time of King Hezekiah, it tells a romantic story in the land of ancient Israel. Young Jewish readers across Eastern Europe devour it in secret, and it awakens a longing for the land that feeds the later Zionist movement." },
      { y: 1858, p: 3, t: "Mortara affair", d: "Papal police in Bologna take six-year-old Edgardo Mortara from his Jewish family because a servant claimed to have secretly baptised him as a baby. Pope Pius IX raises him as a Catholic and refuses all appeals to return him. The case causes outrage across Europe and America. Edgardo grows up to become a Catholic priest." },
      { y: 1860, p: 3, t: "Outside the Old City walls", d: "Jerusalem's Old City is overcrowded, poor and unhealthy. With money left by the American philanthropist Judah Touro, Sir Moses Montefiore builds Mishkenot Sha'ananim, a row of homes just outside the walls. At first residents are so afraid of bandits that they return inside the walls at night. Its success leads to new neighbourhoods and the growth of modern West Jerusalem." },
      { y: 1860, p: 3, t: "Alliance Israélite Universelle", d: "French Jews found the Alliance Israélite Universelle, the first modern international Jewish organisation, to defend Jewish rights around the world. It opens a network of schools across North Africa, the Middle East and the Balkans, teaching French, Hebrew and modern subjects. Its Mikveh Israel agricultural school, founded in 1870, trains early Jewish farmers in the Land of Israel." },
      { y: 1871, p: 3, t: "Equality in Germany", d: "When Germany unites as an empire, Jews are granted full legal equality across the whole country. German Jews flourish in business, science, medicine and the arts, and many feel deeply German. Berlin's grand New Synagogue, with its golden dome, opened in 1866. Yet within a few years, a new political antisemitism begins to grow." },
      { y: 1878, p: 2, t: "Petah Tikva founded", d: "A group of religious Jews from Jerusalem buys swampy land near the Yarkon River and founds Petah Tikva, \"Door of Hope\", the first modern Jewish farming village. Malaria soon forces them to leave, but they return in 1883 with new settlers. It is called the \"Mother of the Settlements\" and today is a large city." },
      { y: 1879, p: 3, t: "Word \"antisemitism\" coined", d: "German journalist Wilhelm Marr popularises the word antisemitism and founds the League of Antisemites. The new term presents hatred of Jews as a scientific racial theory rather than a religious one, so even converts cannot escape it. Antisemitic parties win seats in the German and Austrian parliaments within a few years." },
      { y: 1881, p: 2, t: "Pogroms in Russia", d: "After Tsar Alexander II is assassinated, rumours blame the Jews. Waves of mob violence, called pogroms, sweep through hundreds of towns in the Russian Empire, often with police doing nothing. Harsh new laws then restrict where Jews can live and work. Over the next 40 years more than two million Jews leave Eastern Europe, most for the United States." },
      { y: 1881, p: 2, t: "Ben-Yehuda revives Hebrew", d: "Eliezer Ben-Yehuda arrives in Jerusalem determined to turn Hebrew, used for 2,000 years mainly for prayer and study, back into a living, spoken language. He makes his family speak only Hebrew, and his son becomes the first native Hebrew speaker in modern times. He invents hundreds of new words and writes a huge dictionary. Today millions speak Hebrew every day." },
      { y: 1882, p: 3, t: "First Aliyah", d: "Inspired by the pogroms and early Zionist groups like the Bilu and Hovevei Zion, the first modern wave of Jewish immigrants arrives in the Land of Israel. About 25,000 to 35,000 people come over two decades. They found farming villages like Rishon LeZion, Zikhron Ya'akov and Rosh Pinna, many supported by Baron Edmond de Rothschild. Their struggles with malaria and poverty were severe." },
      { y: 1894, p: 2, t: "Dreyfus affair", d: "Alfred Dreyfus, a Jewish captain in the French army, is falsely convicted of selling secrets to Germany and sent to Devil's Island. At his public degradation, crowds shout \"Death to the Jews!\" The writer Émile Zola publishes \"J'accuse\", exposing the cover-up, and France is torn apart. Dreyfus is finally cleared in 1906. Watching the affair convinced journalist Theodor Herzl that Jews needed a state of their own." },
      { y: 1896, p: 2, t: "Herzl's \"The Jewish State\"", d: "Theodor Herzl, a Viennese journalist shaken by the Dreyfus affair, publishes a short book called Der Judenstaat, \"The Jewish State\". He argues that antisemitism will never disappear, and the only solution is a Jewish state recognised by the world's powers. The book causes a sensation, and a year later he gathers the First Zionist Congress." },
      { y: 1897, p: 1, t: "First Zionist Congress", d: "Theodor Herzl brings about 200 delegates from 17 countries to a concert hall in Basel, Switzerland. They found the Zionist Organisation and adopt the Basel Programme, which aims for a publicly recognised home for the Jewish people in the Land of Israel. Herzl writes in his diary: \"At Basel I founded the Jewish State.\" He predicts it will exist within fifty years. It took fifty-one." },
      { y: 1903, p: 2, t: "Kishinev pogrom", d: "Over Easter, a mob in Kishinev, in today's Moldova, attacks the Jewish community for two days while police stand by. 49 Jews are killed and hundreds injured. The poet Hayim Nahman Bialik writes \"In the City of Slaughter\", furious at both the killers and the victims' helplessness. The pogrom shocks the world and pushes many young Jews towards Zionism and self-defence." },
      { y: 1904, p: 3, t: "Second Aliyah", d: "A new wave of about 35,000 mostly young, idealistic immigrants arrives from Russia. They believe Jews must build the land with their own hands, and they insist on Hebrew and Jewish labour. Among them are David Ben-Gurion and Yitzhak Ben-Zvi, future leaders of Israel. They found the first kibbutz, workers' parties and the Hashomer guard organisation." },
      { y: 1909, p: 3, t: "Tel Aviv founded", d: "Sixty-six Jewish families from overcrowded Jaffa buy sand dunes to the north to build a garden suburb called Ahuzat Bayit. On 11 April 1909 they gather on the beach and divide the plots by lottery, using seashells with names and numbers. The neighbourhood is renamed Tel Aviv, \"hill of spring\", after Herzl's novel. It becomes the first modern Hebrew city and now has hundreds of thousands of residents." },
      { y: 1910, p: 2, t: "First kibbutz, Degania", d: "A group of ten men and two women from the Second Aliyah settle by the Sea of Galilee and found Degania, the first kibbutz. Everything is shared: land, work, income and even child-rearing. The kibbutz movement grows to hundreds of communities, plays a huge role in settling and defending the land, and produces many of Israel's leaders." },
      { y: 1913, p: 3, t: "Beilis trial", d: "Menahem Mendel Beilis, a Jewish brickworks manager in Kyiv, is put on trial for the ritual murder of a Christian boy, a modern blood libel backed by the Russian government. After two years in prison, he is acquitted by a jury of mostly peasants. The case draws worldwide attention. The same year in the US, Leo Frank's trial leads to the founding of the Anti-Defamation League." },
      { y: 1917, p: 2, t: "Balfour Declaration", d: "In a letter to Lord Rothschild, British Foreign Secretary Arthur Balfour states that the government \"view with favour the establishment in Palestine of a national home for the Jewish people\". It also promises to protect the rights of non-Jewish communities. Britain conquers Palestine from the Ottomans weeks later. The declaration becomes part of Britain's League of Nations mandate to govern the land." },
      { y: 1920, p: 3, t: "Haganah founded", d: "After Arab riots in Jerusalem and the death of Joseph Trumpeldor defending Tel Hai in the Galilee, the Jewish community in Palestine sets up the Haganah, \"Defence\", an underground militia to protect Jewish towns and farms. Over the next three decades it grows into a trained army. In 1948 it becomes the core of the Israel Defense Forces." },
      { y: 1925, p: 3, t: "Hebrew University opens", d: "The Hebrew University of Jerusalem opens on Mount Scopus at a ceremony attended by Lord Balfour, Chaim Weizmann and thousands of guests. Albert Einstein, one of its founders, gave the first scientific lecture there in 1923 and later left it his papers. It becomes one of the leading universities in the world." },
      { y: 1929, p: 2, t: "Hebron massacre", d: "After false rumours that Jews plan to seize the Temple Mount, Arab riots break out across Palestine. In Hebron, where Jews have lived for centuries, a mob murders 67 Jews, including students of the Slabodka yeshiva. Some Arab families hide and save Jewish neighbours. The surviving Jews are evacuated, ending the ancient community until after 1967." },
      { y: 1933, p: 2, t: "Nazis take power", d: "Adolf Hitler is appointed Chancellor of Germany on 30 January 1933. Within weeks the Nazis open the first concentration camp at Dachau, and on 1 April they organise a national boycott of Jewish shops, with storm troopers posted outside. Jews are soon pushed out of government jobs, universities and the professions. The 1935 Nuremberg Laws strip Jews of German citizenship and ban marriage with non-Jews." },
      { y: 1935, p: 2, t: "Nuremberg Laws", d: "At the Nazi party rally in Nuremberg, Germany passes laws that strip Jews of citizenship and ban marriage and relationships between Jews and non-Jews. A chart defines who counts as Jewish by the number of Jewish grandparents, regardless of religion. The laws make Jews second-class residents in their own country and lay the legal ground for what follows." },
      { y: 1937, p: 3, t: "Peel Commission", d: "During the Arab revolt of 1936 to 1939, a British Royal Commission under Lord Peel concludes that Jews and Arabs cannot live together under one government. It proposes dividing Palestine into a small Jewish state, a larger Arab state and a British zone around Jerusalem. The Arab leadership rejects it, the Zionists are divided, and Britain drops the plan." },
      { y: 1938, p: 3, t: "Kristallnacht", d: "On the night of 9 to 10 November 1938, the Nazis unleash attacks on Jews across Germany and Austria. Over 1,400 synagogues are burned or damaged, thousands of Jewish shops are smashed, and around 91 Jews are killed. The name means \"night of broken glass\". About 30,000 Jewish men are sent to concentration camps, and the Jewish community is then forced to pay for the damage." },
      { y: 1938, e: 1939, p: 3, t: "Kindertransport", d: "After Kristallnacht, Britain agrees to take in Jewish children from Germany, Austria and Czechoslovakia, but not their parents. Around 10,000 children travel alone by train and ship in the nine months before the war. Most never see their families again. Nicholas Winton helps organise transports of 669 children from Prague." },
      { y: 1939, p: 3, t: "White Paper", d: "On the eve of war, as Jews desperately try to flee Europe, Britain limits Jewish immigration to Palestine to 75,000 over five years and restricts Jews from buying land. Ben-Gurion declares: \"We shall fight the war as if there were no White Paper, and the White Paper as if there were no war.\" Ships of refugees are turned away." },
      { y: 1941, e: 1945, p: 1, t: "The Holocaust", d: "Nazi Germany and its collaborators set out to murder every Jew in Europe. Jews are forced into ghettos, shot in mass killings across Eastern Europe, and deported in cattle cars to death camps like Auschwitz, Treblinka and Sobibor. By 1945, six million Jews have been murdered, including one and a half million children, about two thirds of Europe's Jews. Countless communities are wiped out forever." },
      { y: 1942, p: 2, t: "Wannsee Conference", d: "Fifteen senior Nazi officials meet at a lakeside villa in Wannsee, Berlin, to coordinate the \"Final Solution of the Jewish Question\". Over 90 minutes and a buffet lunch, they plan the deportation and murder of the 11 million Jews of Europe. The minutes, taken by Adolf Eichmann, were found after the war. Mass gassing in death camps begins soon after." },
      { y: 1943, p: 3, t: "Warsaw Ghetto Uprising", d: "When the Germans enter the Warsaw Ghetto to deport its last remaining Jews to Treblinka, young fighters of the Jewish Combat Organisation open fire. Armed with a few pistols, rifles and homemade bombs, they hold off the German army for almost a month. The Germans burn the ghetto block by block. It is the largest Jewish revolt of the war and a lasting symbol of resistance." },
      { y: 1945, p: 2, t: "Auschwitz liberated", d: "On 27 January 1945, Soviet soldiers enter Auschwitz and find around 7,000 starving prisoners left behind. The SS had already forced about 58,000 others on death marches westward. About 1.1 million people were murdered at Auschwitz, around a million of them Jews. In the following months Allied troops liberate Bergen-Belsen, Buchenwald and Dachau." },
      { y: 1947, p: 3, t: "Dead Sea Scrolls found", d: "Bedouin shepherds searching for a lost goat find clay jars of ancient scrolls in a cave at Qumran, near the Dead Sea. Over the next ten years, fragments of about 900 manuscripts are found in eleven caves. Some are over 2,000 years old, a thousand years older than any Hebrew Bible known before. They include every book of the Hebrew Bible except Esther, and a complete scroll of Isaiah." },
      { y: 1947, p: 2, t: "UN partition vote", d: "On 29 November 1947 the UN General Assembly votes 33 to 13 to divide Palestine into a Jewish state and an Arab state, with Jerusalem under international control. Jews dance in the streets. The Arab leadership rejects the plan, and fighting breaks out the next day. The ship Exodus 1947, full of Holocaust survivors turned back by Britain, had helped win world sympathy." },
      { y: 1948, p: 1, t: "State of Israel", d: "On 14 May 1948, the day the British mandate ends, David Ben-Gurion reads Israel's Declaration of Independence in the Tel Aviv Museum. It promises equal rights for all citizens and opens the country to Jewish immigration. The next day, the armies of Egypt, Jordan, Syria, Lebanon and Iraq invade. Israel wins its War of Independence at a cost of about 6,000 lives, one percent of its Jewish population." },
      { y: 1949, e: 1950, p: 3, t: "Operation Magic Carpet", d: "Almost the entire Jewish community of Yemen, around 49,000 people, is flown to Israel on about 380 flights by American and British planes. Many had walked for weeks across the desert to reach the British camp at Aden. Most had never seen an aeroplane, and some recalled the verse from Isaiah about being carried \"on eagles' wings\". An ancient community that had lived in Yemen for over 2,000 years moved almost entirely to Israel." },
      { y: 1950, p: 2, t: "Law of Return", d: "The Knesset passes the Law of Return, giving every Jew in the world the right to move to Israel and become a citizen. In its first few years Israel's population doubles as survivors from Europe and nearly the whole Jewish communities of Iraq, Yemen, Libya and later Morocco arrive. Many live for years in tent camps called ma'abarot." },
      { y: 1951, p: 3, t: "Exodus from Iraq", d: "After years of growing persecution in Iraq, including the Farhud massacre of 1941, the government allows Jews to leave if they give up their citizenship and property. In Operation Ezra and Nehemiah, about 120,000 Iraqi Jews are flown to Israel. A community going back to the Babylonian exile 2,500 years earlier almost disappears in two years." },
      { y: 1953, p: 3, t: "Yad Vashem founded", d: "The Knesset establishes Yad Vashem in Jerusalem as Israel's official memorial to the victims of the Holocaust. Its name comes from Isaiah: \"a memorial and a name\". It collects the names and stories of the six million and honours non-Jews who risked their lives to save Jews as Righteous Among the Nations. Over 28,000 have been recognised." },
      { y: 1956, p: 3, t: "Suez Crisis", d: "After Egypt's President Nasser nationalises the Suez Canal and blocks Israeli shipping, Israel secretly coordinates with Britain and France. Israeli forces sweep across the Sinai Peninsula in under a week. Under heavy pressure from both the United States and the Soviet Union, all three countries withdraw. Israel gains UN peacekeepers on the border and freedom of shipping through the Straits of Tiran." },
      { y: 1961, p: 3, t: "Eichmann trial", d: "Adolf Eichmann, who organised the deportation of millions of Jews to the death camps, is captured in Argentina by Israeli agents and brought to Jerusalem. His televised trial gives survivors a chance to tell their stories to the world, many for the first time. He claims he was only following orders. Eichmann is convicted and hanged in 1962, the only execution ever carried out by the State of Israel." },
      { y: 1966, p: 3, t: "Agnon wins the Nobel", d: "S. Y. Agnon, who wrote stories of Jewish life in Galicia and the Land of Israel, becomes the first Hebrew writer to win the Nobel Prize in Literature. He shares it with the German-Jewish poet Nelly Sachs, who escaped the Holocaust to Sweden. In his speech, Agnon says he was born in Jerusalem, as a result of the historic catastrophe of its destruction." },
      { y: 1967, p: 1, t: "Six-Day War", d: "With Egyptian, Syrian and Jordanian armies massing on its borders, Israel launches a pre-emptive strike. In six days it captures the Sinai and Gaza from Egypt, the West Bank and East Jerusalem from Jordan, and the Golan Heights from Syria. Israeli paratroopers reach the Western Wall, and Jews can pray there for the first time in 19 years. The war reshapes the Middle East." },
      { y: 1970, p: 3, t: "Soviet Jewry movement", d: "Sixteen refuseniks in Leningrad are arrested for planning to hijack an empty plane to escape the Soviet Union. Their harsh sentences spark a worldwide campaign under the slogan \"Let my people go\". Natan Sharansky becomes its best-known prisoner. Pressure from the West slowly opens the gates, leading to the mass aliyah of the 1990s." },
      { y: 1972, p: 2, t: "Munich massacre", d: "During the Olympic Games in Munich, eight Palestinian terrorists from the Black September group break into the Israeli team's apartment. They kill two athletes and take nine others hostage. A failed German rescue attempt at an airfield ends with all nine hostages killed, along with a German police officer. Israel later hunts down those it holds responsible in a years-long covert operation." },
      { y: 1973, p: 2, t: "Yom Kippur War", d: "On Yom Kippur, the holiest day of the Jewish year, Egypt and Syria launch a surprise attack. Egyptian forces cross the Suez Canal and Syrian tanks pour into the Golan Heights. After heavy losses in the first days, Israel pushes back on both fronts, crossing the canal and advancing towards Damascus. Over 2,600 Israeli soldiers are killed, and the shock leads to major changes in Israeli politics." },
      { y: 1975, p: 3, t: "\"Zionism is racism\" resolution", d: "The UN General Assembly passes Resolution 3379 declaring that Zionism is a form of racism. Israel's ambassador Chaim Herzog tears up the resolution at the podium, on the anniversary of Kristallnacht. The US ambassador calls it an infamous act. The resolution is finally revoked in 1991." },
      { y: 1976, p: 3, t: "Entebbe raid", d: "Terrorists hijack an Air France flight from Tel Aviv and fly it to Entebbe, Uganda, where dictator Idi Amin protects them. Non-Israeli passengers are released, but about 100 Israeli and Jewish hostages are held. Israeli commandos fly over 4,000 kilometres and free them in a 90-minute night raid. Three hostages and the commander, Yoni Netanyahu, are killed." },
      { y: 1977, p: 3, t: "Sadat visits Jerusalem", d: "Egyptian President Anwar Sadat becomes the first Arab leader to visit Israel. He flies to Jerusalem and speaks to the Knesset, Israel's parliament, calling for peace. Israelis watch in amazement as the leader of their greatest enemy steps off the plane. The visit opens the way to talks with Prime Minister Menachem Begin, hosted by US President Jimmy Carter." },
      { y: 1979, p: 3, t: "Peace with Egypt", d: "Following the Camp David talks, Israel and Egypt sign a peace treaty on the White House lawn. Israel agrees to return the entire Sinai Peninsula, and Egypt becomes the first Arab country to recognise Israel. Sadat and Begin share the Nobel Peace Prize. The peace holds to this day, though Sadat is assassinated by Islamist extremists in 1981." },
      { y: 1981, p: 3, t: "Osirak strike", d: "Israel believes Iraq's Osirak nuclear reactor, being built with French help near Baghdad, could give Saddam Hussein a nuclear bomb. Eight Israeli F-16 jets fly about 1,600 kilometres across Saudi and Jordanian airspace and destroy it in under two minutes. The world condemns the strike at the time. Many later see it as having prevented Iraq from getting nuclear weapons." },
      { y: 1982, p: 3, t: "First Lebanon War", d: "After repeated attacks on northern Israel from PLO bases in Lebanon, Israel invades. Its forces reach Beirut and besiege the city until the PLO leadership leaves for Tunisia. The massacre of Palestinians at Sabra and Shatila by a Christian militia causes outrage in Israel, and 400,000 people protest in Tel Aviv. Israel stays in a security zone in southern Lebanon until 2000." },
      { y: 1984, e: 1985, p: 3, t: "Operation Moses", d: "Thousands of Ethiopian Jews, known as Beta Israel, walk for weeks to refugee camps in Sudan, and many die on the way. Over seven weeks, Israel secretly airlifts about 8,000 of them from Sudan to Israel. The operation ends suddenly when news of it leaks to the press. Beta Israel had lived in Ethiopia for many centuries, cut off from the rest of the Jewish world." },
      { y: 1987, p: 3, t: "First Intifada", d: "After a traffic accident in Gaza kills four Palestinians, protests erupt and spread across Gaza and the West Bank. The uprising, called the intifada, meaning \"shaking off\", includes strikes, boycotts, stone-throwing and later deadlier attacks. It lasts until 1993. During this time the Islamist group Hamas is founded, and the uprising pushes both sides towards negotiations." },
      { y: 1989, e: 1991, p: 2, t: "Soviet aliyah", d: "For decades Soviet Jews were mostly forbidden to leave, and those who applied, known as refuseniks, often lost their jobs or went to prison. As the Soviet Union opens up and then collapses, the gates finally open. Around a million people move to Israel during the 1990s, growing its population by about 20 percent. They bring huge numbers of engineers, doctors, scientists and musicians." },
      { y: 1991, p: 3, t: "Operation Solomon", d: "As rebels close in on Ethiopia's capital, Addis Ababa, Israel races to rescue the remaining Beta Israel community. In 36 hours, 35 Israeli aircraft fly over 14,000 Ethiopian Jews to Israel. One El Al jumbo jet carries over 1,000 passengers, a world record, and several babies are born during the flights. Seats are removed to fit as many people as possible." },
      { y: 1993, p: 2, t: "Oslo Accords", d: "After secret talks in Norway, Israel and the Palestine Liberation Organization recognise each other. On the White House lawn, Prime Minister Yitzhak Rabin and PLO leader Yasser Arafat shake hands as President Bill Clinton looks on. The accords create the Palestinian Authority with limited self-rule in parts of the West Bank and Gaza. Rabin, Arafat and Shimon Peres share the Nobel Peace Prize." },
      { y: 1994, p: 3, t: "Peace with Jordan", d: "Israel and Jordan sign a peace treaty at a border crossing in the Arava desert, with Prime Minister Rabin, King Hussein and President Clinton present. Jordan becomes the second Arab country to make peace with Israel. The treaty settles the border and water sharing. King Hussein and Rabin had built a warm personal friendship, and the king spoke movingly at Rabin's funeral a year later." },
      { y: 1995, p: 2, t: "Rabin assassinated", d: "On 4 November 1995, after a huge peace rally in Tel Aviv, Prime Minister Yitzhak Rabin is shot dead by Yigal Amir, a Jewish extremist opposed to the Oslo Accords. The country is in shock. Leaders from around the world, including Arab heads of state, attend his funeral in Jerusalem. The square where he was killed is renamed Rabin Square." },
      { y: 2000, p: 2, t: "Second Intifada", d: "After peace talks at Camp David collapse in 2000, a second, far more violent uprising begins. Suicide bombers attack buses, cafés, hotels and nightclubs inside Israel. Over 1,000 Israelis and around 3,000 Palestinians are killed by 2005. Israel launches major military operations in the West Bank and begins building the security barrier." },
      { y: 2000, p: 3, t: "Pope at the Western Wall", d: "Pope John Paul II visits Israel and prays at the Western Wall, placing a note in its stones asking God's forgiveness for Christians who caused Jews to suffer. He also visits Yad Vashem. Coming after the Church's 1965 declaration rejecting the charge that Jews killed Jesus, the visit marks a dramatic change in Catholic-Jewish relations." },
      { y: 2005, p: 2, t: "Gaza disengagement", d: "Prime Minister Ariel Sharon, once the champion of settlements, pulls Israel out of Gaza completely. About 8,000 Israeli settlers are removed from 21 communities, some dragged out by soldiers, and their homes are demolished. Four small settlements in the northern West Bank are also evacuated. Two years later Hamas seizes control of Gaza from the Palestinian Authority." },
      { y: 2005, p: 3, t: "Holocaust Remembrance Day", d: "Sixty years after the liberation of Auschwitz, the United Nations General Assembly names 27 January as International Holocaust Remembrance Day. The resolution rejects any denial of the Holocaust and calls on countries to teach future generations about it. Israel also keeps its own Holocaust Remembrance Day, Yom HaShoah, in spring, when sirens sound and the whole country stands still for two minutes." },
      { y: 2006, p: 3, t: "Second Lebanon War", d: "Hezbollah fighters cross into Israel, kill three soldiers and kidnap two more. Israel responds with air strikes and a ground invasion of southern Lebanon. Hezbollah fires about 4,000 rockets into northern Israel, sending hundreds of thousands of people into shelters or away from their homes. The 34-day war ends with a UN ceasefire, and the bodies of the two kidnapped soldiers are returned in 2008." },
      { y: 2011, p: 3, t: "Gilad Shalit freed", d: "In 2006, Hamas fighters tunnel into Israel and capture 19-year-old soldier Gilad Shalit. He is held in Gaza for over five years with no visits from the Red Cross, while his family campaigns tirelessly for his release. In October 2011 he is exchanged for 1,027 Palestinian prisoners, many convicted of deadly attacks. One of those released, Yahya Sinwar, later plans the 7 October attack." },
      { y: 2014, p: 3, t: "Gaza war", d: "After three Israeli teenagers are kidnapped and murdered in the West Bank, tensions explode. Hamas fires thousands of rockets at Israeli cities, many stopped by the new Iron Dome defence system. Israel launches air strikes and then sends ground troops into Gaza to destroy attack tunnels. The 50-day war kills over 2,000 Palestinians and 73 Israelis." },
      { y: 2018, p: 2, t: "Pittsburgh synagogue attack", d: "During Shabbat morning services, a gunman shouting antisemitic slurs enters the Tree of Life synagogue in the Squirrel Hill neighbourhood of Pittsburgh. He murders 11 worshippers, the oldest aged 97. It is the deadliest antisemitic attack in American history. The attacker was later sentenced to death, and the synagogue is being rebuilt with a memorial." },
      { y: 2018, p: 3, t: "US embassy in Jerusalem", d: "President Donald Trump recognises Jerusalem as Israel's capital, and on 14 May 2018, the 70th anniversary of Israel's independence, the US embassy moves there from Tel Aviv. Most countries had kept their embassies in Tel Aviv because of the city's disputed status. A handful of other countries follow the United States. The move is welcomed in Israel and condemned by Palestinian leaders." },
      { y: 2020, p: 2, t: "Abraham Accords", d: "At the White House, Israel signs agreements to normalise relations with the United Arab Emirates and Bahrain, the first Arab countries to do so since Jordan in 1994. Morocco and Sudan follow within months. Direct flights, trade and tourism begin almost immediately. The accords are named after Abraham, the shared ancestor of Jews and Arabs." },
      { y: 2023, p: 1, t: "7 October attack", d: "On the Simchat Torah holiday, Hamas launches a surprise attack from Gaza by land, sea and air. About 3,000 terrorists break through the border and attack kibbutzim, towns, army bases and the Nova music festival. Around 1,200 people are murdered, most of them civilians, and 251 are taken hostage into Gaza. It is the deadliest day for Jews since the Holocaust." },
      { y: 2023, e: 2025, p: 3, t: "War in Gaza", d: "Israel declares war on Hamas, calls up 360,000 reservists and launches a long air and ground campaign in Gaza. Hezbollah fires on northern Israel from Lebanon, forcing tens of thousands to leave their homes, and Israel later strikes Hezbollah hard. The war causes enormous destruction and loss of life in Gaza. Hostages are freed in stages through ceasefire deals and rescue operations." },
      { y: 2025, p: 3, t: "Twelve-Day War with Iran", d: "In June 2025, Israel launches a large air campaign against Iran's nuclear programme, military leaders and missile sites. Iran fires hundreds of ballistic missiles and drones at Israel, and some get through, causing deaths and damage in cities like Tel Aviv, Bat Yam and Beersheba. The United States joins in and strikes Iran's main nuclear sites. A ceasefire ends the fighting after twelve days." },
      { y: 2025, p: 2, t: "Hostages come home", d: "Under a US-brokered ceasefire and hostage deal, the last 20 living hostages held in Gaza are released on 13 October 2025, after more than two years in captivity. Huge crowds gather in Tel Aviv's Hostages Square to watch them come home. In return, Israel releases nearly 2,000 Palestinian prisoners and detainees. The return of the remaining bodies of hostages who died continues afterwards." }
    ];

    };

    const $ = s => document.querySelector(s);
    const stage = $("#stage"), mini = $("#mini"), pop = $("#pop"), topBar = $(".top"), tip = $("#tip");
    const fmt = y => y < 0 ? `${-y} BCE` : y < 1000 ? `${y} CE` : `${y}`;
    const when = e => (e.c ? "c. " : "") + (e.e ? `${fmt(e.y).replace(/ (BCE|CE)$/, (e.y < 0) === (e.e < 0) ? "" : " $1")}–${fmt(e.e)}` : fmt(e.y));

    let W = 0, H = 0, k = 1, x0 = START;
    const minK = () => W / (END - START);
    const X = y => (y - x0) * k;
    function clamp() {
      k = Math.max(minK(), Math.min(400, k));
      x0 = Math.max(START, Math.min(END - W / k, x0));
    }
    function zoomAt(px, f) { const y = x0 + px / k; k *= f; clamp(); x0 = y - px / k; clamp(); }

    // Build every element once; draw() only moves and shows/hides them.
    const axis = document.createElement("div"); axis.className = "axis"; stage.appendChild(axis);
    const eraEls = ERAS.map(([a, b, name], i) => {
      const el = document.createElement("div"); el.className = "era";
      // Rich manuscript inks: madder red, indigo, ochre, verdigris, plum, olive
      el.style.background = ["#9a3324", "#2e4a7d", "#b5831f", "#2f6f68", "#6e3b68", "#5f6d22"][i % 6];
      el.innerHTML = `<b>${name}</b>`; stage.appendChild(el);
      // Click: fly to this era. Hover: show its summary.
      el.addEventListener("click", ev => { ev.stopPropagation(); if (!moved) { pop.classList.remove("on"); flyTo(a, b); } });
      el.addEventListener("pointerenter", ev => { if (ev.pointerType === "mouse") showTip(i, ev); });
      el.addEventListener("pointermove", ev => { if (ev.pointerType === "mouse") placeTip(ev); });
      el.addEventListener("pointerleave", () => tip.classList.remove("on"));
      return el;
    });
    const tickPool = [];
    EVENTS.forEach(e => {
      e.card = document.createElement("div"); e.card.className = `card p${e.p}`;
      e.card.innerHTML = `<div class="y">${when(e)}</div><div class="t">${e.t}</div>`;
      e.stem = document.createElement("div"); e.stem.className = "stem";
      e.dot = document.createElement("div"); e.dot.className = e.e ? "range" : "dot";
      stage.append(e.stem, e.dot, e.card);
      e.card.addEventListener("click", ev => { if (!moved) open(e); ev.stopPropagation(); });
    });
    // Measure at the left edge so cards near the right side don't get squeezed, then fix the width
    function measure() {
      // max-content keeps the measurement independent of the window width (capped by the card's max-width)
      EVENTS.forEach(e => { Object.assign(e.card.style, { display: "", left: "0px", width: "max-content" }); });
      EVENTS.forEach(e => { e.w = Math.ceil(e.card.getBoundingClientRect().width); e.h = e.card.offsetHeight; });
      EVENTS.forEach(e => { e.card.style.width = e.w + "px"; e.card.style.boxSizing = "border-box"; });
    }

    // Eras get their own ribbon just above the overview strip, so no line or stem ever runs through a name
    const LANE = 74, BAND = 4, ERA_H = 28;
    function draw() {
      const axisY = Math.round(H * .5);
      axis.style.top = axisY - 1 + "px";
      const headBottom = topBar.getBoundingClientRect().bottom + 10, miniTop = mini.getBoundingClientRect().top;
      const eraTop = miniTop - 10 - ERA_H;

      eraEls.forEach((el, i) => {
        const [a, b] = ERAS[i], l = X(a), r = X(b);
        if (r < 0 || l > W) { el.style.display = "none"; return; }
        el.style.display = ""; el.style.left = l + "px"; el.style.width = (r - l) + "px"; el.style.top = eraTop + "px";
        // Centre the name in the part of the era that's on screen
        const lab = el.firstChild, lw = lab.offsetWidth, mid = (Math.max(l, 0) + Math.min(r, W)) / 2 - l;
        lab.style.visibility = (r - l) > lw + 16 ? "" : "hidden";
        lab.style.left = Math.min(Math.max(8, mid - lw / 2), r - l - lw - 8) + "px";
      });

      // Ticks: pick the smallest step that keeps labels ~110px apart
      const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => s * k >= 110) || 1000;
      let n = 0;
      for (let t = Math.ceil(x0 / step) * step; t <= x0 + W / k; t += step, n++) {
        if (!tickPool[n]) { const a = document.createElement("div"), b = document.createElement("div"); a.className = "tick"; b.className = "tlabel"; stage.append(a, b); tickPool[n] = [a, b]; }
        const [a, b] = tickPool[n], x = X(t);
        a.style.display = b.style.display = "";
        a.style.left = x + "px"; a.style.top = axisY + BAND / 2 + "px";
        b.textContent = t === 0 ? "BCE | CE" : fmt(t);
        // Centred under its tick, but never pushed off either edge of the screen
        const bw = b.offsetWidth;
        b.style.left = Math.min(Math.max(x - bw / 2, 6), W - bw - 6) + "px"; b.style.top = axisY + BAND / 2 + 9 + "px";
      }
      for (; n < tickPool.length; n++) tickPool[n][0].style.display = tickPool[n][1].style.display = "none";

      // Lanes: above the axis and below the tick labels, kept clear of the header and the era ribbon.
      // Bigger events claim space first.
      const above = Math.max(1, Math.min(5, Math.floor((axisY - BAND / 2 - 14 - headBottom) / LANE)));
      const belowTop = axisY + BAND / 2 + 40;
      const below = Math.max(1, Math.min(5, Math.floor((eraTop - 10 - belowTop) / LANE)));
      const lanes = [];
      for (let i = 0; i < Math.max(above, below); i++) { if (i < above) lanes.push({ up: 1, i, used: [], stems: [] }); if (i < below) lanes.push({ up: 0, i, used: [], stems: [] }); }
      const order = EVENTS.slice().sort((a, b) => a.p - b.p || a.y - b.y);
      for (const e of order) {
        const x = X(e.y), xe = e.e ? X(e.e) : x;
        e.lane = null;
        if (e.p === 3 && k < 2) { hide(e); continue; }
        if (xe < 0 || x > W) { hide(e); continue; }
        const flip = x + e.w > W - 6, l = flip ? x - e.w - 14 : x - 4, r = flip ? x + 4 : x + e.w + 14;
        // A lane works if the card fits there, no other card's line runs through it,
        // and its own line won't cut through a card in a lane nearer the axis
        const inner = L => lanes.filter(M => M.up === L.up && M.i < L.i);
        e.lane = lanes.find(L => L.used.every(([a, b]) => r < a || l > b) && L.stems.every(sx => sx < l || sx > r)
          && (e.p === 1 || inner(L).every(M => M.used.every(([a, b]) => x + 3 < a || x - 3 > b))));
        if (!e.lane) { hide(e); continue; }
        const L = e.lane, top = L.up ? axisY - BAND / 2 - 14 - L.i * LANE - e.h : belowTop + L.i * LANE;
        // Cards nearer the axis that this event's line has to pass (only major events may do this)
        const crossed = inner(L).flatMap(M => M.used.filter(([a, b]) => x + 3 >= a && x - 3 <= b));
        L.used.push([l, r, top, top + e.h]);
        inner(L).forEach(M => M.stems.push(x));
        Object.assign(e.card.style, { display: "", left: (flip ? x - e.w + 1 : x - 1) + "px", top: top + "px" });
        e.card.classList.toggle("flip", flip);
        const sTop = L.up ? top + e.h : axisY, sH = L.up ? axisY - top - e.h : top - axisY;
        // Break the line where it passes behind another label, so it never runs through the text
        const gaps = crossed.map(([, , t, b]) => [Math.max(0, t - 4 - sTop), Math.min(sH, b + 4 - sTop)]).sort((a, b) => a[0] - b[0]);
        let bg = "", at = 0;
        gaps.forEach(([g0, g1]) => { bg += `var(--line) ${at}px ${g0}px, transparent ${g0}px ${g1}px, `; at = g1; });
        Object.assign(e.stem.style, { display: "", left: x + "px", top: sTop + "px", height: sH + "px",
          background: gaps.length ? `linear-gradient(to bottom, ${bg}var(--line) ${at}px)` : "" });
        Object.assign(e.dot.style, { display: "", left: x + (e.e ? 0 : 0) + "px", top: axisY + "px", width: e.e ? Math.max(9, xe - x) + "px" : "" });
      }
      drawMini();
    }
    function hide(e) { e.card.style.display = e.stem.style.display = e.dot.style.display = "none"; }

    // Overview strip
    const miniWin = document.createElement("div"); miniWin.className = "win";
    ERAS.forEach(([a, b], i) => { const el = document.createElement("i"); el.style.left = (a - START) / (END - START) * 100 + "%"; el.style.width = (b - a) / (END - START) * 100 + "%"; el.style.background = eraEls[i].style.background; mini.appendChild(el); });
    mini.appendChild(miniWin);
    function drawMini() { miniWin.style.left = (x0 - START) / (END - START) * 100 + "%"; miniWin.style.width = Math.max(.6, (W / k) / (END - START) * 100) + "%"; }
    function miniJump(ev) { const r = mini.getBoundingClientRect(), y = START + (ev.clientX - r.left) / r.width * (END - START); x0 = y - W / k / 2; clamp(); draw(); }
    mini.addEventListener("pointerdown", ev => { mini.setPointerCapture(ev.pointerId); miniJump(ev); mini.onpointermove = miniJump; });
    mini.addEventListener("pointerup", () => { mini.onpointermove = null; });

    // Zoom and pan
    stage.addEventListener("wheel", ev => {
      ev.preventDefault();
      const px = ev.clientX - stage.getBoundingClientRect().left;
      if (ev.ctrlKey) zoomAt(px, Math.exp(-ev.deltaY * .012));
      else if (Math.abs(ev.deltaX) > Math.abs(ev.deltaY)) { x0 += ev.deltaX / k; clamp(); }
      else zoomAt(px, Math.exp(-ev.deltaY * .0018));
      draw();
    }, { passive: false });

    const pts = new Map(); let moved = false, pinch = null;
    stage.addEventListener("pointerdown", ev => {
      pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); moved = false;
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.abs(a.x - b.x); }
    });
    addEventListener("pointermove", ev => {
      if (!pts.has(ev.pointerId)) return;
      const p = pts.get(ev.pointerId), dx = ev.clientX - p.x;
      if (Math.abs(dx) > 3 || Math.abs(ev.clientY - p.y) > 3) { moved = true; stage.classList.add("dragging"); }
      if (pts.size === 1) { if (moved) { x0 -= dx / k; clamp(); p.x = ev.clientX; p.y = ev.clientY; draw(); } }
      else if (pts.size === 2) {
        p.x = ev.clientX; p.y = ev.clientY;
        const [a, b] = [...pts.values()], d = Math.abs(a.x - b.x), mid = (a.x + b.x) / 2 - stage.getBoundingClientRect().left;
        if (pinch && d > 10) zoomAt(mid, d / pinch); pinch = d; draw();
      }
    });
    const up = ev => { pts.delete(ev.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) stage.classList.remove("dragging"); };
    addEventListener("pointerup", up); addEventListener("pointercancel", up);
    stage.addEventListener("click", () => { if (!moved) pop.classList.remove("on"); });

    // Smoothly move and zoom so years a..b fill the screen, with a little margin either side
    function flyTo(a, b) {
      const pad = (b - a) * .06, tk = Math.max(minK(), Math.min(400, W / (b - a + 2 * pad))), tc = (a + b) / 2;
      const k0 = k, c0 = x0 + W / k / 2, t0 = performance.now();
      const stepFn = now => {
        const t = Math.min(1, (now - t0) / 650), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        k = k0 * Math.pow(tk / k0, e); x0 = c0 + (tc - c0) * e - W / k / 2; clamp(); draw();
        if (t < 1) requestAnimationFrame(stepFn);
      };
      requestAnimationFrame(stepFn);
    }

    function showTip(i, ev) {
      const [dates, text] = ERA_INFO[ERAS[i][2]] || ["", ""];
      tip.innerHTML = `<div class="d">${dates}</div><h3>${ERAS[i][2]}</h3><p>${text}</p><div class="go">Click to explore this era</div>`;
      tip.style.setProperty("--c", eraEls[i].style.background);
      tip.classList.add("on"); placeTip(ev);
    }
    addEventListener("pointermove", ev => { if (!ev.target.closest || !ev.target.closest(".era")) tip.classList.remove("on"); }, { passive: true });
    function placeTip(ev) {
      const w = tip.offsetWidth, h = tip.offsetHeight;
      tip.style.left = Math.min(Math.max(ev.clientX - w / 2, 12), innerWidth - w - 12) + "px";
      tip.style.top = ev.clientY - h - 18 + "px";
    }

    function animateZoom(f) {
      const target = Math.max(minK(), Math.min(400, k * f)), from = k, t0 = performance.now();
      const stepFn = now => { const t = Math.min(1, (now - t0) / 280), e = 1 - Math.pow(1 - t, 3); zoomAt(W / 2, from * Math.pow(target / from, e) / k); draw(); if (t < 1) requestAnimationFrame(stepFn); };
      requestAnimationFrame(stepFn);
    }
    $("#zin").onclick = () => animateZoom(2);
    $("#zout").onclick = () => animateZoom(.5);
    $("#zfit").onclick = () => animateZoom(minK() / k);
    addEventListener("keydown", ev => {
      if (ev.key === "+" || ev.key === "=") animateZoom(2);
      else if (ev.key === "-") animateZoom(.5);
      else if (ev.key === "0") animateZoom(minK() / k);
      else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") { x0 += (ev.key === "ArrowRight" ? 1 : -1) * W * .25 / k; clamp(); draw(); }
      else if (ev.key === "Escape") pop.classList.remove("on");
    });

    function open(e) {
      pop.querySelector(".y").textContent = when(e);
      pop.querySelector("h2").textContent = e.t;
      pop.querySelector("p").textContent = e.d;
      // Every event has an image from Wikimedia Commons, credited underneath with a link to its source page
      const im = IMAGES[e.t], fig = pop.querySelector("figure");
      fig.hidden = !im; pop.classList.toggle("has-img", !!im);
      if (im) {
        const img = fig.querySelector("img");
        img.src = `/assets/timeline/${im[0]}`; img.alt = e.t;
        fig.querySelector("figcaption").innerHTML = `<a href="${im[2]}" target="_blank" rel="noopener">${im[1]}</a>`;
      }
      pop.classList.add("on");
    }
    pop.querySelector(".x").onclick = () => pop.classList.remove("on");

    function resize() {
      const keep = W ? { mid: x0 + W / k / 2, span: W / k } : null;
      W = stage.clientWidth; H = stage.clientHeight;
      if (keep) { k = W / keep.span; x0 = keep.mid - keep.span / 2; } else { k = minK(); x0 = START; }
      clamp(); draw();
    }
    addEventListener("resize", resize);

    // Yad follows the mouse (mouse devices only)
    if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
      const yad = $("#yad");
      document.body.classList.add("yadded");
      addEventListener("pointermove", e => { yad.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`; yad.classList.add("on"); }, { passive: true });
      document.addEventListener("mouseleave", () => yad.classList.remove("on"));
    } else $("#yad").remove();

    resize(); measure(); draw();
    document.fonts.ready.then(() => { measure(); draw(); });
  </script>
</body>
</html>
