    @font-face { font-family: "Kanisah"; src: url("/assets/fonts/kanisah.ttf") format("truetype"); font-display: swap; }

    /* Image is 3840 x 2151. The stage keeps that shape and always fills the screen:
       wide screens crop a little top and bottom, tall phones scroll sideways. */
    :root { --r: 1.7852; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f07; }
    .scene { position: fixed; inset: 0; overflow: hidden; }
    .stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: max(100vw, calc(100dvh * var(--r))); aspect-ratio: 3840 / 2151; }
    .stage img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
    /* Phones held upright: full height, swipe sideways along the table */
    @media (orientation: portrait) {
      .scene { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .scene::-webkit-scrollbar { display: none; }
      .stage { left: 0; transform: translateY(-50%); }
    }

    /* Click zones: positioned in % of the image so they stay on their object at any size */
    .spot { position: absolute; display: block; border-radius: 45%; outline: none; -webkit-tap-highlight-color: transparent; }
    .spot::before { content: ""; position: absolute; inset: -8%; border-radius: 50%; pointer-events: none; opacity: 0;
      background: radial-gradient(closest-side, rgba(255, 240, 200, .5), rgba(255, 214, 150, .3) 60%, rgba(255, 200, 120, 0) 100%);
      filter: blur(4px);
      mix-blend-mode: screen; transition: opacity .25s ease; }
    .spot:hover::before, .spot:focus-visible::before, .spot.on::before { opacity: 1; }

    /* White pop-up that follows the pointer */
    .tip { position: fixed; z-index: 10; left: 0; top: 0; width: max-content; max-width: min(270px, calc(100vw - 24px)); box-sizing: border-box;

      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .55); font: 400 13.5px/1.4 system-ui, -apple-system, sans-serif;
      opacity: 0; transform: translateY(4px); transition: opacity .15s ease, transform .15s ease; }
    .tip.show { opacity: 1; transform: none; }
    .tip h2 { margin: 0 0 4px; font: 400 21px/1.1 "Kanisah", Georgia, serif; letter-spacing: .02em; color: #3b2a14; }
    .tip p { margin: 0; }
    .tip .go { display: block; margin-top: 8px; padding-top: 7px; border-top: 1px solid #eadfcb; font-size: 12px; font-weight: 600; color: #8a6420; }
    .tip .tap { display: none; font-weight: 400; color: #9a8a70; }
    @media (hover: none) { .tip .tap { display: inline; } }

    .back:hover { background: rgba(26, 15, 7, .8); }
    @media (prefers-reduced-motion: reduce) { .spot::before, .tip { transition: none; } }

    const stage = document.getElementById('stage'), tip = document.getElementById('tip');
    const touch = matchMedia('(hover: none)').matches;
    let active = null, armed = null;

    SPOTS.forEach(s => {
      const a = document.createElement('a');
      a.className = 'spot';
      a.href = '/learn/jewish-history/' + s.slug + '/';
      a.setAttribute('aria-label', s.title + ': ' + s.text);
      const [l, t, w, h] = s.box;
      a.style.cssText = `left:${l}%;top:${t}%;width:${w}%;height:${h}%`;
      if (!touch) {
        a.addEventListener('mouseenter', e => show(a, s, e.clientX, e.clientY));
        a.addEventListener('mousemove', e => place(e.clientX, e.clientY));
        a.addEventListener('mouseleave', hide);
        a.addEventListener('focus', () => { const r = a.getBoundingClientRect(); show(a, s, r.left + r.width / 2, r.top + r.height / 2); });
        a.addEventListener('blur', hide);
      }
      // Phones: first tap shows the pop-up, second tap opens the page
      a.addEventListener('click', e => {
        if (!touch || armed === a) return;
        e.preventDefault();
        const r = a.getBoundingClientRect();
        show(a, s, r.left + r.width / 2, r.top + r.height / 2);
        armed = a;
      });
      stage.appendChild(a);
    });

    function show(a, s, x, y) {
      if (active) active.classList.remove('on');
      active = a; a.classList.add('on');
      tip.querySelector('h2').textContent = s.title;
      tip.querySelector('p').textContent = s.text;
      tip.querySelector('.go').innerHTML = 'Opens: ' + s.title + ' →<span class="tap"> · tap again to open</span>';
      tip.classList.add('show');
      place(x, y);
    }
    function hide() { if (active) active.classList.remove('on'); active = armed = null; tip.classList.remove('show'); }
    function place(x, y) {
      const w = tip.offsetWidth, h = tip.offsetHeight, pad = 12, gap = 18;
      let left = x + gap, top = y + gap;
      if (left + w > innerWidth - pad) left = x - w - gap;
      if (top + h > innerHeight - pad) top = y - h - gap;
      tip.style.left = Math.max(pad, left) + 'px';
      tip.style.top = Math.max(pad, top) + 'px';
    }
    // Tapping anywhere else closes the pop-up
    document.addEventListener('click', e => { if (touch && !e.target.closest('.spot')) hide(); });
    document.querySelector('.scene').addEventListener('scroll', () => { if (touch) hide(); }, { passive: true });

    // On narrow screens the image is wider than the screen: start in the middle of the table
    const scene = document.querySelector('.scene');
    const centre = () => { scene.scrollLeft = (scene.scrollWidth - scene.clientWidth) / 2; };
    centre(); addEventListener('orientationchange', () => setTimeout(centre, 300));
