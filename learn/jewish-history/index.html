    :root { --r: 1.7852; }

    .stage img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }

    .flame::before { content: ""; position: absolute; left: -110%; right: -110%; top: -40%; bottom: -55%; border-radius: 50%;

      mix-blend-mode: screen; animation: halo var(--d2, 2.6s) ease-in-out infinite alternate; }
    .flame::after { content: ""; position: absolute; inset: 0; border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
      background: radial-gradient(ellipse 50% 60% at 50% 72%, rgba(255, 252, 230, .95), rgba(255, 214, 120, .7) 45%, rgba(255, 150, 40, 0) 100%);
      mix-blend-mode: screen; transform-origin: 50% 100%; animation: flicker var(--d, 1.3s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
    @keyframes flicker {
      0%   { transform: scale(1, 1) skewX(0deg); opacity: .8; }

      32%  { transform: scale(1.06, .9) skewX(-3deg); opacity: .65; }
      50%  { transform: scale(.9, 1.22) skewX(-6deg); opacity: .95; }
      68%  { transform: scale(1.04, .94) skewX(3deg); opacity: .7; }

    @keyframes halo { from { opacity: .5; transform: scale(.9); } to { opacity: 1; transform: scale(1.1); } }

    @media (prefers-reduced-motion: reduce) { .spot::before, .tip { transition: none; } .flame::before, .flame::after, .flap { animation: none; } }

    const stage = document.getElementById('stage'), tip = document.getElementById('tip');

    SPOTS.forEach(s => {
      const a = document.createElement('a');
      a.className = 'spot';
      a.href = '/learn/jewish-history/' + s.slug + '/';
      a.setAttribute('aria-label', s.title + ': ' + s.text);
      const [l, t, w, h] = s.box;
      a.style.cssText = `left:${l}%;top:${t}%;width:${w}%;height:${h}%` + (s.rot ? `;transform:rotate(${s.rot}deg)` : '');
      if (!touch) {
        a.addEventListener('mouseenter', e => show(a, s, e.clientX, e.clientY));
        a.addEventListener('mousemove', e => place(e.clientX, e.clientY));
        a.addEventListener('mouseleave', hide);
        a.addEventListener('focus', () => { const r = a.getBoundingClientRect(); show(a, s, r.left + r.width / 2, r.top + r.height / 2); });
        a.addEventListener('blur', hide);
      }
      // Phones: first tap shows the pop-up, second tap opens the page
      a.addEventListener('click', e => {
        if (!touch || armed === a) return;
        e.preventDefault();
        const r = a.getBoundingClientRect();
        show(a, s, r.left + r.width / 2, r.top + r.height / 2);
        armed = a;
      });
      stage.appendChild(a);
    });

    function show(a, s, x, y) {
      if (active) active.classList.remove('on');
      active = a; a.classList.add('on');

      tip.querySelector('p').textContent = s.text;
      tip.querySelector('.go').innerHTML = 'Opens: ' + s.title + ' →<span class="tap"> · tap again to open</span>';
      tip.classList.add('show');
      place(x, y);
    }
    function hide() { if (active) active.classList.remove('on'); active = armed = null; tip.classList.remove('show'); }

      const w = tip.offsetWidth, h = tip.offsetHeight, pad = 12, gap = 18;
      let left = x + gap, top = y + gap;
      if (left + w > innerWidth - pad) left = x - w - gap;
      if (top + h > innerHeight - pad) top = y - h - gap;
      tip.style.left = Math.max(pad, left) + 'px';
      tip.style.top = Math.max(pad, top) + 'px';
    }

    // Flames: [left, top, width, height] in % of the image, each with its own rhythm so they don't flicker in step

      f.style.cssText = `left:${x1 / W * 100}%;top:${y1 / H * 100}%;width:${bw / W * 100}%;height:${bh / H * 100}%;` +
        `background-size:${W / bw * 100}% ${H / bh * 100}%;background-position:${x1 / (W - bw) * 100}% ${y1 / (H - bh) * 100}%;` +
        `clip-path:polygon(${outline.map(([x, y]) => `${((x - x1) / bw * 100).toFixed(1)}% ${((y - y1) / bh * 100).toFixed(1)}%`).join(',')})`;
      const img = stage.querySelector('img');
      const setBg = () => { f.style.backgroundImage = `url("${img.currentSrc || img.src}")`; };
      img.complete ? setBg() : img.addEventListener('load', setBg);
      stage.insertBefore(f, stage.querySelector('.spot'));
    })();

    // Welcome text: fade in (1.2s), hold (2s), then each letter breaks up and floats away
    (async () => {
      const intro = document.getElementById('intro'), h1 = intro.querySelector('h1');
      const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      h1.innerHTML = h1.innerHTML.split('<br>').map(line => line.split(' ').map(word =>
        '<span class="w">' + [...word].map(c => '<span class="l">' + c + '</span>').join('') + '</span>').join(' ')).join('<br>');
      try { await Promise.race([document.fonts.load('40px "Bebas Neue"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
      const veil = intro.querySelector('.veil');
      veil.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1000, easing: 'ease-out', fill: 'forwards' });
      await h1.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }],
        { duration: 1200, easing: 'ease-out', fill: 'forwards' }).finished;
      await new Promise(r => setTimeout(r, 2000));
      if (calm) { await h1.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 800, fill: 'forwards' }).finished; intro.remove(); return; }
      const rnd = (a, b) => a + Math.random() * (b - a);
      veil.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1800, delay: 400, easing: 'ease-in-out', fill: 'forwards' });
      const runs = [...h1.querySelectorAll('.l')].map(l => {
        const delay = rnd(0, 900), r = l.getBoundingClientRect();
        // a few specks of "dust" shed by each letter as it goes
        for (let k = 0; k < 3; k++) {
          const d = document.createElement('i');
          d.className = 'dust';
          d.style.left = rnd(r.left, r.right) + 'px'; d.style.top = rnd(r.top, r.bottom) + 'px';
          document.body.appendChild(d);
          d.animate([{ opacity: 0, transform: 'none' }, { opacity: .9, offset: .15 },
                     { opacity: 0, transform: `translate(${rnd(-70, 70)}px, ${rnd(-170, -50)}px) scale(${rnd(.4, .9)})` }],
            { duration: rnd(1300, 2200), delay: delay + rnd(0, 300), easing: 'ease-out', fill: 'forwards' }).finished.then(() => d.remove());
        }
        return l.animate([{ opacity: 1, transform: 'none', filter: 'blur(0px)' },
                          { opacity: 0, transform: `translate(${rnd(-40, 40)}px, ${rnd(-140, -60)}px) rotate(${rnd(-35, 35)}deg) scale(.6)`, filter: 'blur(6px)' }],
          { duration: rnd(1300, 1900), delay, easing: 'cubic-bezier(.35, .05, .65, 1)', fill: 'forwards' }).finished;
      });
      await Promise.all(runs);
      intro.remove();
    })();

    // On narrow screens the image is wider than the screen: start in the middle of the table
    const scene = document.querySelector('.scene');
    const centre = () => { scene.scrollLeft = (scene.scrollWidth - scene.clientWidth) / 2; };
    centre(); addEventListener('orientationchange', () => setTimeout(centre, 300));
  </script>
</body>
</html>
